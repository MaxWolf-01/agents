<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mx — the full cycle</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f5f5; --paper2:#ececec; --node:#ffffff;
  --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399;
  --rule:rgba(45,49,66,.12);
  --accent:#eb6c36; --accent-tint:rgba(235,108,54,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#2d3142; --paper2:#393e53; --node:#393e53;
    --ink:#f5f5f5; --muted:#bfc0c0; --soft:#8e98ac;
    --rule:rgba(245,245,245,.12);
    --accent:#f08a59; --accent-tint:rgba(240,138,89,.10);
  }
}
body{background:var(--paper); color:var(--ink); font-family:'Geist',sans-serif; margin:0; padding:32px 56px 24px;}
svg{display:block; max-width:1200px;}
.mask{fill:var(--paper);}
.card{fill:var(--node); stroke:var(--ink); stroke-width:1;}
.card-focal{fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2;}
.card-ghost{fill:var(--paper2); stroke:var(--rule); stroke-width:1;}
.bar{fill:rgba(45,49,66,.05); stroke:var(--muted); stroke-width:.8;}
@media (prefers-color-scheme: dark){ .bar{fill:rgba(245,245,245,.05);} }
.flow{fill:none; stroke:var(--muted); stroke-width:1.2;}
.flow-accent{fill:none; stroke:var(--accent); stroke-width:1.2; stroke-dasharray:5 4;}
.gate{stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; opacity:.7;}
.m-muted{fill:var(--muted);} .m-accent{fill:var(--accent);}
text{fill:var(--ink);}
.name{font:600 12px 'Geist',sans-serif;}
.barname{font:600 11px 'Geist',sans-serif;}
.cmd{font:400 9px 'Geist Mono',monospace; fill:var(--muted);}
.cmd8{font:400 8px 'Geist Mono',monospace; fill:var(--muted);}
.note{font:400 9px 'Geist',sans-serif; fill:var(--soft);}
.eb{font:500 8px 'Geist Mono',monospace; letter-spacing:.18em; fill:var(--muted);}
.al{font:400 8px 'Geist Mono',monospace; letter-spacing:.06em; fill:var(--muted);}
.al-accent{font:400 8px 'Geist Mono',monospace; letter-spacing:.06em; fill:var(--accent);}
.rule{stroke:var(--rule); stroke-width:1;}
.legend-text{font:400 8px 'Geist Mono',monospace; letter-spacing:.05em; fill:var(--muted);}
</style>
</head>
<body>
<svg viewBox="0 0 1200 672" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="m-muted"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="m-accent"/>
    </marker>
  </defs>

  <!-- gate (zone layer) -->
  <line class="gate" x1="992" y1="96" x2="992" y2="384"/>

  <!-- connectors -->
  <path class="flow" d="M 152,88 V 116" marker-end="url(#arrow)"/>
  <path class="flow" d="M 240,168 H 298" marker-end="url(#arrow)"/>
  <path class="flow" d="M 480,168 H 538" marker-end="url(#arrow)"/>
  <path class="flow" d="M 720,168 H 778" marker-end="url(#arrow)"/>
  <path class="flow" d="M 872,216 V 266" marker-end="url(#arrow)"/>
  <path class="flow" d="M 960,168 H 1018" marker-end="url(#arrow)"/>
  <path class="flow-accent" d="M 1112,216 V 480 Q 1112,488 1104,488 H 200 Q 192,488 192,480 V 222" marker-end="url(#arrow-accent)"/>
  <path class="flow-accent" d="M 872,368 V 482" marker-end="url(#arrow-accent)"/>
  <path class="flow-accent" d="M 672,488 V 222" marker-end="url(#arrow-accent)"/>
  <path class="flow-accent" d="M 124,536 V 222" marker-end="url(#arrow-accent)"/>

  <!-- nodes -->
  <rect class="card-focal" x="64" y="120" width="176" height="96" rx="6"/>
  <rect class="card" x="304" y="120" width="176" height="96" rx="6"/>
  <rect class="card" x="544" y="120" width="176" height="96" rx="6"/>
  <rect class="card-ghost" x="800" y="104" width="176" height="96" rx="6"/>
  <rect class="card-ghost" x="792" y="112" width="176" height="96" rx="6"/>
  <rect class="card" x="784" y="120" width="176" height="96" rx="6"/>
  <rect class="card" x="784" y="272" width="176" height="96" rx="6"/>
  <rect class="card" x="1024" y="120" width="176" height="96" rx="6"/>
  <rect class="card" x="64" y="536" width="208" height="76" rx="6"/>

  <!-- durable docs bar: three segments -->
  <rect class="bar" x="304" y="544" width="276" height="52" rx="4"/>
  <rect class="bar" x="592" y="544" width="276" height="52" rx="4"/>
  <rect class="bar" x="880" y="544" width="280" height="52" rx="4"/>

  <!-- labels -->
  <text class="eb" x="64" y="80">IDEA &middot; BRIEF &middot; BUG REPORT</text>

  <text class="name" x="76" y="144">Sharpen the idea</text>
  <text class="cmd" x="76" y="160">/mx:grill-with-docs</text>
  <text class="note" x="76" y="178">terms + decisions written down</text>
  <text class="note" x="76" y="192">big + foggy? /mx:wayfinder</text>

  <text class="name" x="316" y="144">Spec</text>
  <text class="cmd" x="316" y="160">/mx:to-spec</text>
  <text class="note" x="316" y="178">user stories + app-wide properties</text>
  <text class="note" x="316" y="192">from a wayfinder map? you review it</text>

  <text class="name" x="556" y="144">Tickets</text>
  <text class="cmd" x="556" y="160">/mx:to-tickets</text>
  <text class="note" x="556" y="178">tracer bullets in a dependency DAG</text>
  <text class="note" x="556" y="192">you review the cut</text>

  <text class="name" x="796" y="144">Build the frontier</text>
  <text class="cmd" x="796" y="160">/mx:implement &middot; /mx:dispatch</text>
  <text class="note" x="796" y="178">fresh window per ticket</text>
  <text class="note" x="796" y="191">independent ones run in parallel</text>
  <text class="note" x="796" y="204">open questions filed, never buried</text>

  <text class="name" x="796" y="296">Drive each landed slice</text>
  <text class="cmd" x="796" y="312">(human in the loop)</text>
  <text class="note" x="796" y="330">every landed ticket is demoable</text>
  <text class="note" x="796" y="344">before end-to-end: agent shows</text>
  <text class="note" x="796" y="358">screenshots + demos instead</text>

  <text class="name" x="1036" y="144">Review session</text>
  <text class="cmd" x="1036" y="160">(use the app + grill)</text>
  <text class="note" x="1036" y="178">raw findings in, sorted out:</text>
  <text class="note" x="1036" y="192">fixes &middot; tickets &middot; re-grills</text>

  <text class="name" x="80" y="560">Codebase health</text>
  <text class="cmd8" x="80" y="576">/mx:improve-codebase-architecture</text>
  <text class="note" x="80" y="590">when agent output dips: improve</text>
  <text class="note" x="80" y="603">the feedback loops &rarr; new idea</text>

  <text class="barname" x="320" y="566">CONTEXT.md</text>
  <text class="note" x="320" y="582">the domain glossary — read by every session</text>
  <text class="barname" x="608" y="566">decisions/</text>
  <text class="note" x="608" y="582">ADRs: the why behind choices — read every session</text>
  <text class="barname" x="896" y="566">agent/prototypes/</text>
  <text class="note" x="896" y="582">kept as reference, consulted when relevant</text>

  <!-- gate + arrow labels -->
  <rect class="mask" x="918" y="82" width="148" height="16" rx="4"/>
  <text class="eb" x="992" y="93" text-anchor="middle">FIRST END-TO-END</text>

  <rect class="mask" x="884" y="230" width="52" height="14" rx="4"/>
  <text class="al" x="888" y="240">LANDED</text>

  <rect class="mask" x="684" y="340" width="76" height="14" rx="4"/>
  <text class="al-accent" x="688" y="350">NEW TICKETS</text>

  <rect class="mask" x="380" y="466" width="120" height="14" rx="4"/>
  <text class="al-accent" x="440" y="476" text-anchor="middle">REOPENED DECISIONS</text>

  <rect class="mask" x="136" y="292" width="60" height="14" rx="4"/>
  <text class="al-accent" x="140" y="302">NEW IDEA</text>

  <!-- legend -->
  <line class="rule" x1="64" y1="632" x2="1160" y2="632"/>
  <rect class="card-focal" x="64" y="650" width="24" height="12" rx="3"/>
  <text class="legend-text" x="96" y="659">human-in-the-loop alignment</text>
  <rect class="card-ghost" x="284" y="646" width="20" height="14" rx="3"/>
  <rect class="card" x="280" y="650" width="20" height="14" rx="3"/>
  <text class="legend-text" x="312" y="659">N tickets, fresh context each</text>
  <line class="flow" x1="512" y1="655" x2="548" y2="655" marker-end="url(#arrow)"/>
  <text class="legend-text" x="556" y="659">the flow</text>
  <line class="flow-accent" x1="640" y1="655" x2="676" y2="655"/>
  <text class="legend-text" x="684" y="659">feedback — the board absorbs it</text>
  <line class="gate" x1="908" y1="648" x2="908" y2="662"/>
  <text class="legend-text" x="920" y="659">first end-to-end checkpoint</text>
  <rect class="bar" x="1080" y="650" width="24" height="12" rx="3"/>
  <text class="legend-text" x="1112" y="659">durable docs</text>
</svg>
</body>
</html>
