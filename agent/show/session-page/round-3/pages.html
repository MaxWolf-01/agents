<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How the pages fit together, and one turn in order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    :root {
      color-scheme: light dark;
      --ground: light-dark(#f4e4cd, #1a1714);
      --ground-2: light-dark(#eddabe, #201c18);
      --edge: light-dark(#cfbca3, #4a433b);
      --muted: light-dark(#5e5650, #b0a89e);
      --body: light-dark(#37261d, #ede3d2);
      --strong: light-dark(#22140b, #faf2dc);
      --accent: light-dark(#426724, #6ea444);
      --accent-2: light-dark(#674806, #cdb78a);
      --wash: light-dark(rgb(66 103 36 / 0.16), rgb(110 164 68 / 0.22));
      --wash-ink: color-mix(in srgb, var(--muted) 6%, transparent);
      --mark: light-dark(rgb(168 139 81 / 0.35), rgb(205 183 138 / 0.35));
      --font-body: "Newsreader", Georgia, serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --size-body: 19px;
      --leading-body: 1.62;
      --measure: 38rem;
      --page: 60rem;
      --radius: 6px;
    }
    [data-theme="day"] { color-scheme: light; }
    [data-theme="night"] { color-scheme: dark; }

    body { margin: 0; background: var(--ground); color: var(--body); font: 400 var(--size-body) / var(--leading-body) var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    ::selection { background: var(--mark); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
    code { font-family: var(--font-mono); font-size: 0.875em; }
    p { margin: 0; }

    .v-title { font-weight: 600; font-size: clamp(1.875rem, 3.5vw, 2.5rem); line-height: 1.12; letter-spacing: -0.022em; color: var(--strong); margin: 0; }
    .v-h2 { font-weight: 600; font-size: 1.3em; line-height: 1.3; letter-spacing: -0.012em; color: var(--strong); margin: 0; }
    .v-h3 { font-weight: 600; font-size: 1.05em; line-height: 1.4; color: var(--strong); }
    .v-small { font-size: 0.92em; line-height: 1.6; }
    .v-meta { font-family: var(--font-mono); font-size: 0.8125rem; line-height: 1.5; color: var(--muted); font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }

    .page { max-width: var(--page); margin: 0 auto; padding: 0 2rem; }
    .row { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--edge); }
    .scheme { margin-left: auto; display: inline-flex; padding: 0.25rem; border: 0; background: none; color: var(--muted); cursor: pointer; transition: color 150ms; }
    .scheme:hover { color: var(--accent); }
    [data-theme="night"] .sun, [data-theme="day"] .moon { display: none; }

    .hero { padding: 3rem 0 0.5rem; }
    .hero .v-meta { margin-top: 0.75rem; }
    main section { margin-top: 3.5rem; }
    main section:last-child { margin-bottom: 5rem; }
    figure { margin: 1.5rem 0 0; }
    figcaption { margin-top: 1rem; max-width: var(--measure); }

    svg.fig { display: block; width: 100%; height: auto; }
    .fig .zone { fill: var(--wash-ink); stroke: var(--edge); stroke-width: 1; }
    .fig .mask { fill: var(--ground); }
    .fig .c { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .fig .cb { fill: none; stroke: var(--body); stroke-width: 1.2; }
    .fig .dash { stroke-dasharray: 5 4; }
    .fig .life { stroke: var(--edge); stroke-width: 1; }
    .fig .rule { stroke: var(--edge); stroke-width: 1; }
    .fig .store { fill: var(--ground-2); stroke: var(--muted); stroke-width: 1; }
    .fig .svc { fill: var(--ground-2); stroke: var(--body); stroke-width: 1; }
    .fig .actor { fill: var(--ground); stroke: var(--muted); stroke-width: 1; }
    .fig .focal { fill: var(--wash); stroke: var(--accent); stroke-width: 1.2; }
    .fig .cond { fill: var(--ground-2); stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
    .fig .open { fill: var(--ground); stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 0.5 3.5; stroke-linecap: round; }
    .fig .mk-m { fill: var(--muted); }
    .fig .mk-b { fill: var(--body); }

    .fig text { font-family: var(--font-body); }
    .fig .n { font-weight: 600; font-size: 14px; fill: var(--body); }
    .fig .n.fa { fill: var(--accent); }
    .fig .r { font-size: 13px; fill: var(--body); }
    .fig .d { font-size: 13px; fill: var(--muted); }
    .fig .l { font-size: 13px; fill: var(--muted); }
    .fig .lb { font-size: 13px; fill: var(--body); }
    .fig .aside { font-size: 12px; fill: var(--muted); }
    .fig .mr { font-family: var(--font-mono); font-size: 12px; fill: var(--body); }
    .fig .md { font-family: var(--font-mono); font-size: 12px; fill: var(--muted); }
    .fig .zl, .fig .num, .fig .lg { font-family: var(--font-mono); font-size: 13px; fill: var(--muted); }
    .fig .tag { font-family: var(--font-mono); font-size: 12px; fill: var(--muted); }
    .fig .mid { text-anchor: middle; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="page">
    <div class="row">
      <span class="v-h3">session page</span>
      <button class="scheme" id="scheme" aria-label="switch to night">
        <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      </button>
    </div>
  </header>

  <main class="page">
    <div class="hero">
      <h1 class="v-title">How the pages fit together, and one turn in order</h1>
      <p class="v-meta">figures for agent/tickets/session-page/spec.md, round 3</p>
    </div>

    <!-- ============================================================ -->
    <section>
      <h2 class="v-h2">Which page carries what</h2>
      <figure>
        <svg class="fig" viewBox="0 0 960 792" role="img" aria-labelledby="f1-title">
          <title id="f1-title">The text files agents write, what renders each page from them, and the links between the pages</title>
          <defs>
            <marker id="f1-m" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="mk-m"/></marker>
          </defs>

          <!-- zones -->
          <rect class="zone" x="8" y="136" width="704" height="136" rx="8"/>
          <rect class="zone" x="8" y="432" width="944" height="344" rx="8"/>

          <!-- connectors: who writes, who renders -->
          <line class="c" x1="240" y1="96" x2="240" y2="134" marker-end="url(#f1-m)"/>
          <line class="c" x1="344" y1="56" x2="734" y2="56" marker-end="url(#f1-m)"/>
          <line class="c" x1="840" y1="96" x2="840" y2="462" marker-end="url(#f1-m)"/>
          <line class="c" x1="120" y1="248" x2="120" y2="310" marker-end="url(#f1-m)"/>
          <line class="c" x1="360" y1="248" x2="360" y2="310" marker-end="url(#f1-m)"/>
          <line class="c" x1="600" y1="248" x2="600" y2="310" marker-end="url(#f1-m)"/>
          <line class="c" x1="120" y1="392" x2="120" y2="462" marker-end="url(#f1-m)"/>
          <line class="c" x1="360" y1="392" x2="360" y2="462" marker-end="url(#f1-m)"/>
          <line class="c" x1="600" y1="392" x2="600" y2="462" marker-end="url(#f1-m)"/>

          <!-- connectors: page to page -->
          <path class="c" d="M132,560 V608 Q132,616 140,616 H340 Q348,616 348,608 V562" marker-end="url(#f1-m)"/>
          <path class="c" d="M396,560 V608 Q396,616 404,616 H580 Q588,616 588,608 V562" marker-end="url(#f1-m)"/>
          <path class="c" d="M636,560 V608 Q636,616 644,616 H820 Q828,616 828,608 V562" marker-end="url(#f1-m)"/>
          <path class="c" d="M108,560 V664 Q108,672 116,672 H364 a8,8 0 0,1 16,0 H604 Q612,672 612,664 V562" marker-end="url(#f1-m)"/>
          <path class="c" d="M372,560 V704 Q372,712 380,712 H844 Q852,712 852,704 V562" marker-end="url(#f1-m)"/>
          <path class="c" d="M84,560 V744 Q84,752 92,752 H868 Q876,752 876,744 V562" marker-end="url(#f1-m)"/>

          <!-- nodes -->
          <rect class="actor" x="136" y="16" width="208" height="80" rx="6"/>
          <rect class="actor" x="736" y="16" width="208" height="80" rx="6"/>
          <rect class="store" x="16" y="168" width="208" height="80" rx="6"/>
          <rect class="store" x="256" y="168" width="208" height="80" rx="6"/>
          <rect class="store" x="496" y="168" width="208" height="80" rx="6"/>
          <rect class="actor" x="16" y="312" width="208" height="80" rx="6"/>
          <rect class="actor" x="256" y="312" width="448" height="80" rx="6"/>
          <rect class="svc" x="16" y="464" width="208" height="96" rx="6"/>
          <rect class="mask" x="256" y="464" width="208" height="96" rx="6"/>
          <rect class="focal" x="256" y="464" width="208" height="96" rx="6"/>
          <rect class="svc" x="496" y="464" width="208" height="96" rx="6"/>
          <rect class="svc" x="736" y="464" width="208" height="96" rx="6"/>

          <!-- labels: zones -->
          <rect class="mask" x="16" y="128" width="94" height="16"/>
          <text class="zl" x="24" y="140">text files</text>
          <rect class="mask" x="16" y="424" width="55" height="16"/>
          <text class="zl" x="24" y="436">pages</text>

          <!-- labels: nodes -->
          <text class="n" x="148" y="40">main session</text>
          <text class="r" x="148" y="57">the session you talk to</text>
          <text class="d" x="148" y="74">writes text files, no HTML</text>

          <text class="n" x="748" y="40">subagent or fork</text>
          <text class="r" x="748" y="57">builds each artifact</text>
          <text class="md" x="748" y="74">through /mx:show</text>

          <text class="n" x="28" y="192">tickets</text>
          <text class="mr" x="28" y="209">NN-&lt;slug&gt;.md</text>
          <text class="md" x="28" y="226">agent/tickets/&lt;feature&gt;/</text>

          <text class="n" x="268" y="192">session and turn records</text>
          <text class="mr" x="268" y="209">session.md, turns/NN.md</text>
          <text class="md" x="268" y="226">agent/sessions/&lt;id&gt;/</text>

          <text class="n" x="508" y="192">spec</text>
          <text class="mr" x="508" y="209">spec.md</text>
          <text class="md" x="508" y="226">agent/tickets/&lt;feature&gt;/</text>

          <text class="n" x="28" y="336">board command</text>
          <text class="r" x="28" y="353">renders the board</text>
          <text class="d" x="28" y="370">on every tracker change</text>

          <text class="n" x="268" y="336">Stop hook</text>
          <text class="r" x="268" y="353">renders both pages as each turn ends</text>
          <text class="d" x="268" y="370">your messages come from the session's transcript</text>

          <text class="n" x="28" y="488">board</text>
          <text class="r" x="28" y="505">the tracker as one page</text>
          <text class="d" x="28" y="522">every feature and ticket</text>
          <text class="md" x="28" y="539">agent/board.html</text>

          <text class="n fa" x="268" y="488">session page</text>
          <text class="r" x="268" y="505">one per session</text>
          <text class="d" x="268" y="522">questions on top, turns below</text>
          <text class="md" x="268" y="539">agent/sessions/&lt;id&gt;/</text>

          <text class="n" x="508" y="488">spec page</text>
          <text class="r" x="508" y="505">the spec, rendered</text>
          <text class="d" x="508" y="522">figures inside, changes marked</text>
          <text class="d" x="508" y="539">replaces diffview for specs</text>

          <text class="n" x="748" y="488">artifacts</text>
          <text class="r" x="748" y="505">figures, explainer pages, demos</text>
          <text class="d" x="748" y="522">each a page of its own</text>
          <text class="md" x="748" y="539">agent/show/&lt;work&gt;/</text>

          <!-- labels: connectors -->
          <text class="l" x="252" y="120">writes</text>
          <text class="l mid" x="540" y="44">hands each artifact to</text>

          <text class="l mid" x="240" y="588">links each session it lists</text>
          <text class="tag mid" x="240" y="604">after board-orients</text>
          <text class="l mid" x="492" y="604">links the spec page</text>
          <text class="l mid" x="732" y="604">shows its figures inside it</text>
          <text class="l mid" x="240" y="644">links each feature's spec page</text>
          <text class="tag mid" x="240" y="660">after board-orients</text>
          <text class="l mid" x="612" y="700">links a turn's artifacts</text>
          <text class="l mid" x="480" y="740">links each ticket's artifacts</text>
        </svg>
        <figcaption class="v-small muted">Every page you read is rendered from text files the main session writes, except the artifacts, which a subagent builds as pages of their own; the arcs under the pages say what each page links to.</figcaption>
      </figure>
    </section>

    <!-- ============================================================ -->
    <section>
      <h2 class="v-h2">One turn, in order</h2>
      <figure>
        <svg class="fig" viewBox="0 0 960 1032" role="img" aria-labelledby="f2-title">
          <title id="f2-title">One turn of a session that has a session page, from your message to the page being ready</title>
          <defs>
            <marker id="f2-m" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="mk-m"/></marker>
            <marker id="f2-b" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="mk-b"/></marker>
          </defs>

          <!-- frame for the artifact steps -->
          <rect class="zone" x="208" y="144" width="392" height="192" rx="8"/>

          <!-- lifelines -->
          <line class="life" x1="96" y1="72" x2="96" y2="964"/>
          <line class="life" x1="288" y1="72" x2="288" y2="964"/>
          <line class="life" x1="480" y1="72" x2="480" y2="320"/>
          <line class="life" x1="672" y1="72" x2="672" y2="964"/>
          <line class="life" x1="864" y1="72" x2="864" y2="964"/>

          <!-- messages -->
          <line class="cb" x1="96" y1="120" x2="286" y2="120" marker-end="url(#f2-b)"/>
          <line class="c dash" x1="288" y1="192" x2="478" y2="192" marker-end="url(#f2-m)"/>
          <line class="c dash" x1="480" y1="308" x2="290" y2="308" marker-end="url(#f2-m)"/>
          <line class="cb" x1="288" y1="472" x2="98" y2="472" marker-end="url(#f2-b)"/>
          <line class="cb" x1="288" y1="520" x2="670" y2="520" marker-end="url(#f2-b)"/>
          <line class="c dash" x1="672" y1="584" x2="290" y2="584" marker-end="url(#f2-m)"/>
          <line class="c dash" x1="672" y1="648" x2="290" y2="648" marker-end="url(#f2-m)"/>
          <line class="cb" x1="672" y1="876" x2="862" y2="876" marker-end="url(#f2-b)"/>
          <line class="cb" x1="96" y1="940" x2="862" y2="940" marker-end="url(#f2-b)"/>

          <!-- parties -->
          <rect class="actor" x="16" y="16" width="160" height="56" rx="6"/>
          <rect class="svc" x="208" y="16" width="160" height="56" rx="6"/>
          <rect class="svc" x="400" y="16" width="160" height="56" rx="6"/>
          <rect class="svc" x="592" y="16" width="160" height="56" rx="6"/>
          <rect class="mask" x="784" y="16" width="160" height="56" rx="6"/>
          <rect class="focal" x="784" y="16" width="160" height="56" rx="6"/>

          <!-- boxes on lifelines -->
          <rect class="cond" x="376" y="212" width="208" height="56" rx="6"/>
          <rect class="svc" x="160" y="360" width="256" height="56" rx="6"/>
          <rect class="open" x="536" y="700" width="272" height="56" rx="6"/>
          <rect class="svc" x="536" y="780" width="272" height="40" rx="6"/>

          <!-- labels: frame -->
          <rect class="mask" x="216" y="136" width="354" height="16"/>
          <text class="tag" x="224" y="148">only if the answer needs a figure, page or demo</text>

          <!-- labels: parties -->
          <text class="n mid" x="96" y="40">you</text>
          <text class="d mid" x="96" y="57">terminal, then browser</text>
          <text class="n mid" x="288" y="40">main session</text>
          <text class="d mid" x="288" y="57">the session you talk to</text>
          <text class="n mid" x="480" y="40">subagent</text>
          <text class="d mid" x="480" y="57">or a fork</text>
          <text class="n mid" x="672" y="40">Stop hook</text>
          <text class="d mid" x="672" y="57">runs as each turn ends</text>
          <text class="n fa mid" x="864" y="40">session page</text>
          <text class="d mid" x="864" y="57">in the browser</text>

          <!-- labels: step numbers -->
          <text class="num" x="16" y="124">01</text>
          <text class="num" x="16" y="196">02</text>
          <text class="num" x="16" y="244">03</text>
          <text class="num" x="16" y="312">04</text>
          <text class="num" x="16" y="392">05</text>
          <text class="num" x="16" y="476">06</text>
          <text class="num" x="16" y="524">07</text>
          <text class="num" x="16" y="588">08</text>
          <text class="num" x="16" y="652">09</text>
          <text class="num" x="16" y="732">10</text>
          <text class="num" x="16" y="804">11</text>
          <text class="num" x="16" y="880">12</text>
          <text class="num" x="16" y="944">13</text>

          <!-- labels: steps -->
          <text class="lb mid" x="192" y="108">your message, in the terminal</text>

          <text class="lb mid" x="384" y="180">hands over the artifact</text>
          <text class="lb mid" x="480" y="236">builds it through <tspan class="mr">/mx:show</tspan></text>
          <text class="d mid" x="480" y="253">where its prose is reviewed</text>
          <text class="lb mid" x="384" y="296">built</text>

          <text class="lb mid" x="288" y="384">writes the turn record, <tspan class="mr">turns/NN.md</tspan></text>
          <text class="d mid" x="288" y="401">headline, questions, details, links</text>

          <text class="lb mid" x="192" y="444">the chat reply: one line</text>
          <text class="lb mid" x="192" y="460">and the session page's link</text>

          <text class="lb mid" x="480" y="508">the turn ends, and the Stop hook runs</text>

          <text class="lb mid" x="480" y="556">if the answer is in the chat and there is no turn record:</text>
          <text class="lb mid" x="480" y="572">sent back to move the answer onto the page</text>

          <text class="lb mid" x="480" y="620">if the turn record does not parse:</text>
          <text class="lb mid" x="480" y="636">sent back with the reason; nothing is rendered</text>

          <text class="aside mid" x="480" y="676">either way, the main session fixes it and the turn ends again at 07</text>

          <text class="tag mid" x="672" y="724">open question Q7, not decided</text>
          <text class="lb mid" x="672" y="741">a light prose review of the turn record</text>

          <text class="lb mid" x="672" y="804">reads your messages from the transcript</text>

          <text class="lb mid" x="768" y="848">renders the session page</text>
          <text class="lb mid" x="768" y="864">and the spec page</text>

          <text class="lb mid" x="480" y="912">you open the link, or reload the tab, once the turn has ended</text>
          <text class="aside mid" x="480" y="928">whether an open tab reloads by itself is not decided</text>

          <!-- legend -->
          <line class="rule" x1="16" y1="984" x2="944" y2="984"/>
          <line class="cb" x1="16" y1="1008" x2="46" y2="1008" marker-end="url(#f2-b)"/>
          <text class="lg" x="56" y="1012">every turn</text>
          <line class="c dash" x1="176" y1="1008" x2="206" y2="1008" marker-end="url(#f2-m)"/>
          <text class="lg" x="216" y="1012">only when its condition holds</text>
          <rect class="open" x="480" y="1000" width="24" height="16" rx="3"/>
          <text class="lg" x="512" y="1012">open question, not decided</text>
        </svg>
        <figcaption class="v-small muted">One turn in a session that has a session page: the main session writes text and hands any artifact to a subagent, the Stop hook checks the text and renders the page, and you open it once the turn has ended.</figcaption>
      </figure>
    </section>
  </main>

  <script>
    const root = document.documentElement
    const theme = new URLSearchParams(location.search).get("theme")
    const dark = theme ? theme === "night" : matchMedia("(prefers-color-scheme: dark)").matches
    const scheme = document.getElementById("scheme")
    const set = (night) => {
      root.dataset.theme = night ? "night" : "day"
      scheme.setAttribute("aria-label", night ? "switch to day" : "switch to night")
    }
    scheme.addEventListener("click", () => set(root.dataset.theme !== "night"))
    set(dark)
  </script>
</body>
</html>
