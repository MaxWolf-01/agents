<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mx: what changes</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --paper:light-dark(#f5f5f5,#2d3142); --paper2:light-dark(#ececec,#393e53); --node:light-dark(#ffffff,#393e53);
  --ink:light-dark(#2d3142,#f5f5f5); --muted:light-dark(#4f5d75,#bfc0c0); --soft:light-dark(#7a8399,#8e98ac);
  --rule:light-dark(rgba(45,49,66,.12),rgba(245,245,245,.12));
  --accent:light-dark(#eb6c36,#f08a59); --accent-tint:light-dark(rgba(235,108,54,.08),rgba(240,138,89,.10));
}
body{background:var(--paper); color:var(--ink); font-family:'Geist',sans-serif; margin:0; padding:44px 56px 32px;}
.eyebrow{font:500 10px 'Geist Mono',monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:0 0 8px;}
h1{font:600 1.25rem 'Geist',sans-serif; margin:0 0 8px;}
.dek{font-size:13px; color:var(--muted); max-width:720px; line-height:1.5; margin:0 0 24px;}
svg{display:block; width:100%; height:auto;}
.rule{stroke:var(--rule); stroke-width:1;}
.card{fill:var(--node); stroke:var(--ink); stroke-width:1;}
.card-focal{fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2;}
.card-ghost{fill:var(--paper2); stroke:var(--rule); stroke-width:1;}
.flow{fill:none; stroke:var(--muted); stroke-width:1.2;}
.m-muted{fill:var(--muted);}
text{fill:var(--ink);}
.name{font:600 12px 'Geist',sans-serif;}
.sub{font:400 9px 'Geist',sans-serif; fill:var(--soft);}
.body{font:400 10px 'Geist',sans-serif; fill:var(--ink);}
.body-soft{font:400 10px 'Geist',sans-serif; fill:var(--muted);}
.eb{font:500 8px 'Geist Mono',monospace; letter-spacing:.18em; fill:var(--muted);}
.topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:32px;}
.scheme{flex:none; font:500 8px 'Geist Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); background:var(--paper2); border:1px solid var(--rule); border-radius:6px; padding:5px 10px; cursor:pointer;}
.scheme:hover{color:var(--ink);}
</style>
</head>
<body>
<header class="topbar">
  <p class="eyebrow">mx workflow &middot; one flow &middot; what changes</p>
  <button class="scheme"></button>
</header>
<h1>What the one-flow spec changes, row by row.</h1>
<p class="dek">Today on the left, the spec's design on the right. Everything not listed stays as it is: the spec format,
the ticket files, dispatch's tick, the board, the review page.</p>

<svg viewBox="0 0 1200 948" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="m-muted"/>
    </marker>
  </defs>

  <!-- header -->
  <text class="eb" x="272" y="36">TODAY</text>
  <text class="eb" x="720" y="36">ONE FLOW</text>
  <line class="rule" x1="64" y1="48" x2="1164" y2="48"/>

  <!-- connectors, one per row at top+32 -->
  <path class="flow" d="M 680,96 H 708" marker-end="url(#arrow)"/>
  <path class="flow" d="M 680,176 H 708" marker-end="url(#arrow)"/>
  <path class="flow" d="M 680,256 H 708" marker-end="url(#arrow)"/>

  <path class="flow" d="M 680,656 H 708" marker-end="url(#arrow)"/>
  <path class="flow" d="M 680,736 H 708" marker-end="url(#arrow)"/>
  <path class="flow" d="M 680,816 H 708" marker-end="url(#arrow)"/>
  <path class="flow" d="M 680,896 H 708" marker-end="url(#arrow)"/>

  <!-- cards, rows of 80 from y=64, card height 64 -->
  <rect class="card-ghost" x="272" y="64" width="400" height="64" rx="6"/>
  <rect class="card" x="720" y="64" width="444" height="64" rx="6"/>
  <rect class="card-ghost" x="272" y="144" width="400" height="64" rx="6"/>
  <rect class="card" x="720" y="144" width="444" height="64" rx="6"/>
  <rect class="card-ghost" x="272" y="224" width="400" height="64" rx="6"/>
  <rect class="card" x="720" y="224" width="444" height="64" rx="6"/>
  <rect class="card-ghost" x="272" y="304" width="400" height="64" rx="6"/>
  <rect class="card" x="720" y="304" width="444" height="64" rx="6"/>
  <rect class="card-ghost" x="272" y="384" width="400" height="64" rx="6"/>
  <rect class="card" x="720" y="384" width="444" height="64" rx="6"/>
  <rect class="card-ghost" x="272" y="464" width="400" height="64" rx="6"/>
  <rect class="card" x="720" y="464" width="444" height="64" rx="6"/>
  <rect class="card-ghost" x="272" y="544" width="400" height="64" rx="6"/>
  <rect class="card" x="720" y="544" width="444" height="64" rx="6"/>
  <rect class="card-ghost" x="272" y="624" width="400" height="64" rx="6"/>
  <rect class="card" x="720" y="624" width="444" height="64" rx="6"/>
  <rect class="card-ghost" x="272" y="704" width="400" height="64" rx="6"/>
  <rect class="card" x="720" y="704" width="444" height="64" rx="6"/>
  <rect class="card-ghost" x="272" y="784" width="400" height="64" rx="6"/>
  <rect class="card-focal" x="720" y="784" width="444" height="64" rx="6"/>
  <rect class="card-ghost" x="272" y="864" width="400" height="64" rx="6"/>
  <rect class="card" x="720" y="864" width="444" height="64" rx="6"/>

  <!-- row labels -->
  <text class="name" x="64" y="92">The implement skill</text>
  <text class="sub" x="64" y="107">/mx:implement</text>
  <text class="name" x="64" y="172">The gate's size call</text>
  <text class="sub" x="64" y="187">/mx:orient, step 3</text>
  <text class="name" x="64" y="252">A standalone ticket</text>
  <text class="sub" x="64" y="267">judgment in it, no design round</text>
  <text class="name" x="64" y="332">Speculative build</text>
  <text class="sub" x="64" y="347">the gate, the breakdown quiz</text>
  <text class="name" x="64" y="412">The demo</text>
  <text class="sub" x="64" y="427">what a landing arrives as</text>
  <text class="name" x="64" y="492">Review delivery</text>
  <text class="sub" x="64" y="507">/mx:code-review, step 5</text>
  <text class="name" x="64" y="572">Prototypes</text>
  <text class="sub" x="64" y="587">/mx:prototype, /mx:orient</text>
  <text class="name" x="64" y="652">Prose rules</text>
  <text class="sub" x="64" y="667">the tells catalogue</text>
  <text class="name" x="64" y="732">The review rule</text>
  <text class="sub" x="64" y="747">user CLAUDE.md, commit hook</text>
  <text class="name" x="64" y="812">Where your attention goes</text>
  <text class="sub" x="64" y="827">the bottleneck</text>
  <text class="name" x="64" y="892">Best-of-N</text>
  <text class="sub" x="64" y="907">several workers, one ticket</text>

  <!-- row 1: the implement skill -->
  <text class="body-soft" x="284" y="90">Two readers, a worker alone in a pane and an agent chatting with you;</text>
  <text class="body-soft" x="284" y="104">its closing rules contradict each other.</text>
  <text class="body" x="732" y="90">Deleted. Its process lives in the worker prompt, which is the worker's</text>
  <text class="body" x="732" y="104">system prompt, so no skill load can be skipped. Nothing in chat loads it.</text>

  <!-- row 2: the gate's size call -->
  <text class="body-soft" x="284" y="170">"Build here from the spec, or to-tickets." The in-session build runs in a</text>
  <text class="body-soft" x="284" y="184">context already spent on the discussion, with no other review station.</text>
  <text class="body" x="732" y="170">Always to-tickets, one ticket or many; always a fresh worker from the file.</text>
  <text class="body" x="732" y="184">The gate strips the marks; it no longer holds the build.</text>

  <!-- row 3: a standalone ticket -->
  <text class="body-soft" x="284" y="250">No path. Done loose with the brief living in the chat, or with a feature's</text>
  <text class="body-soft" x="284" y="264">full ceremony: feature worktree, host pick, orchestrator loop, board.</text>
  <text class="body" x="732" y="243">Written cold by the session and built at once; dispatched with the same</text>
  <text class="body" x="732" y="257">scripts and host selection as a feature's, cut from and merged into the</text>
  <text class="body" x="732" y="271">integration branch. On the board.</text>

  <!-- row 4: speculative build -->
  <text class="body-soft" x="284" y="330">The gate holds the build until you confirm the spec, and the breakdown</text>
  <text class="body-soft" x="284" y="344">quiz holds it again; a session you leave mid-grilling builds nothing.</text>
  <text class="body" x="732" y="323">The build starts once no question is left for you, on the agent's calls;</text>
  <text class="body" x="732" y="337">proposed tickets build while the board shows them; you rule on the artifact,</text>
  <text class="body" x="732" y="351">accept lands, reject deletes. One level deep; integration waits for you.</text>

  <!-- row 5: the demo -->
  <text class="body-soft" x="284" y="417">A review page and a chat summary of what now works.</text>
  <text class="body" x="732" y="410">The thing itself, opened: the page served, the command driven, a screenshot,</text>
  <text class="body" x="732" y="424">a recording; then the review page. Named in the worker's closing comment.</text>

  <!-- row 6: review delivery -->
  <text class="body-soft" x="284" y="490">One chat message with every axis report verbatim, fixed findings included,</text>
  <text class="body-soft" x="284" y="504">a verification block, a per-axis summary; the reports deleted after reading.</text>
  <text class="body" x="732" y="483">Reports stay on disk under the reviewed range; the worker fixes or declines</text>
  <text class="body" x="732" y="497">each finding and indexes them in its closing comment; you get the page and</text>
  <text class="body" x="732" y="511">the calls only you can make.</text>

  <!-- row 7: prototypes -->
  <text class="body-soft" x="284" y="577">Reached for whenever something could be tried before building it.</text>
  <text class="body" x="732" y="570">Rival shapes only: something that must be seen or driven, or designs to</text>
  <text class="body" x="732" y="584">compare. A single clear design is built and judged as itself.</text>

  <!-- row 8: prose rules -->
  <text class="body-soft" x="284" y="650">In every generator prompt: output style, worker prompt, user CLAUDE.md,</text>
  <text class="body-soft" x="284" y="664">two skills with overlapping catalogues; the reviewer gets a pointer.</text>
  <text class="body" x="732" y="650">One catalogue with rule ids and scope tags, read by the Standards reviewer</text>
  <text class="body" x="732" y="664">on every diff; a Stop hook has a small model read every chat reply.</text>

  <!-- row 9: the review rule and the commit hook -->
  <text class="body-soft" x="284" y="730">User CLAUDE.md asks for a review before every batch shown to you;</text>
  <text class="body-soft" x="284" y="744">a hook repeats it after every commit. Both compete with the workflow.</text>
  <text class="body" x="732" y="730">Deleted. Review has two stations: inside the worker contract, and once over</text>
  <text class="body" x="732" y="744">the whole feature. Loose work gets no agent review; its page is its gate.</text>

  <!-- row 10: where your attention goes -->
  <text class="body-soft" x="284" y="810">Reading tickets, specs and notes an agent just wrote; every batch in chat;</text>
  <text class="body-soft" x="284" y="824">flagging slop yourself; agents stopping to ask you to look.</text>
  <text class="body" x="732" y="803">Four stations: open questions in grilling rounds, the demo and review page</text>
  <text class="body" x="732" y="817">per landed slice, QA, the needs-human queue. No agent waits for you to</text>
  <text class="body" x="732" y="831">ratify a call or read a brief.</text>

  <!-- row 11: best-of-N -->
  <text class="body-soft" x="284" y="897">Not designed.</text>
  <text class="body" x="732" y="890">Not designed; its own decision ticket. The seam is kept: one ticket,</text>
  <text class="body" x="732" y="904">one worker, one branch, one review page; N plugs in at spawn and landing.</text>

  <line class="rule" x1="64" y1="940" x2="1164" y2="940"/>
</svg>
<script>
const root = document.documentElement, button = document.querySelector('.scheme');
let dark = matchMedia('(prefers-color-scheme: dark)').matches;
const apply = () => {
  root.style.colorScheme = dark ? 'dark' : 'light';
  button.textContent = dark ? 'Light' : 'Dark';
  button.setAttribute('aria-label', `Switch to ${dark ? 'light' : 'dark'} mode`);
};
button.addEventListener('click', () => { dark = !dark; apply(); });
apply();
</script>
</body>
</html>
