# PROTOTYPE data, throwaway. What the build would read from each ticket (a short name, the
# `## Brief` section, `priority` and `size` in frontmatter, a theme), written here so the
# prototype touches no ticket. Priority is the agent's reading of the user's 2026-09-22
# ordering. Size is the user's time: the review, QA or design session it takes.

themes:
  board: The board
  review: Code review
  figures: Figures and demos
  dispatch: Dispatch
  later: Bigger questions

tickets:
  # the board a returning user reads: being designed with the user now
  priority-and-size:
    name: Priority and size on tickets
    theme: board
    priority: 1
    size: S
    brief: Every ticket gets a priority, the agent's reading, and a size, your time on it; the board orders by them.
  ticket-brief-and-artefacts:
    name: A brief on every ticket
    theme: board
    priority: 1
    size: M
    brief: Each ticket opens with two sentences written for you, and the board links what it produced.
  board-carries-what-needs-you:
    name: One place for what waits on you
    theme: board
    priority: 1
    size: M
    brief: Everything waiting on you on one page, each call tagged so any session can take your answer.
  ticket-sessions:
    name: Resume a ticket's sessions
    theme: board
    priority: 1
    size: S
    brief: The sessions that worked on a ticket, each with its title and a command to resume it.
  gh-live-state:
    name: Live state on GitHub links
    theme: board
    priority: 1
    size: XS
    brief: A PR or issue link shows open, merged or changes requested without opening it.

  # code review
  review-launcher:
    name: The code-review script
    theme: review
    priority: 2
    size: M
    brief: A `review` script now starts the reviewers and collects their reports; the skill keeps only the judgment. Every worker's self-review runs through it.
    why: Every review, the workers' included, runs through it.
    asks:
      - tag: D10
        text: "**Give the Tests reviewer its own checkout?** A scratch `git worktree` inside its report folder, where it may break code on purpose and run the tests, so it finds tests that miss bugs again without touching the worker's tree. Goes with the amend that drops the two-at-a-time cap."
  every-property-gets-a-criterion:
    name: Every spec property reaches a ticket
    theme: review
    priority: 2
    size: S
    brief: Splitting a spec into tickets now fails when a property lands in no ticket. Specs number their properties P1, P2 so tickets can cite them.
    why: Twenty minutes, and every later breakdown checks itself.
  harden-has-no-target:
    name: A make harden target for this repo
    theme: review
    priority: 3
    size: XS
    brief: The workflow runs `make harden` when a feature finishes, and this repo has no such target, so every missed-bug check was done by hand.
  figure-and-demo-rule-checked:
    name: Review checks for a missing figure
    theme: review
    priority: 3
    size: S
    brief: The Spec reviewer flags a design decision that should have a figure and has none; one run in five skipped it today.
  comment-density-ceiling:
    name: A ceiling on comment density
    theme: later
    priority: 4
    size: M
    brief: A check that fails files whose comments outweigh their code, the limit measured from code you already accept.

  # figures and demos
  figures-and-demos/06:
    name: Final review of figures-and-demos
    theme: figures
    priority: 1
    size: M
    brief: The whole-feature review fixed 39 findings. Seven spec lines still state older decisions, two of them real questions. Accepting it lets the feature merge.
    why: Accepting it merges the feature and frees the four figure tickets and the dispatch drawing.
    asks:
      - tag: D9
        text: "**Cut a release once the feature merges?** The worker hosts run the older plugin until then; one `make release-patch` and a push covers everything in flight."
  render-check:
    name: Stale figure images fail the check
    theme: figures
    priority: 3
    size: XS
    brief: "`make check` fails when a committed figure image no longer matches its source."
  ticket-state-figure-review:
    name: The review state in the README figure
    theme: figures
    priority: 3
    size: XS
    brief: The ticket-state figure still lacks the review state.
  svg-guide-vs-figure-set:
    name: SVG guide or figures, one is wrong
    theme: figures
    priority: 3
    size: S
    brief: The SVG guide forbids three things every README figure does; you look at the renders and pick.
  show-conventions-checked:
    name: Show conventions, checked
    theme: figures
    priority: 3
    size: S
    brief: One check for the show rules nothing reads today, such as a show directory whose work is gone.

  # dispatch
  dispatch-shown:
    name: The dispatch flow, drawn
    theme: dispatch
    priority: 2
    size: M
    brief: One page with the ticket states and every command each role types, to spot what is doubled before simplifying. After figures-and-demos merges.
  loose-work-review-page:
    name: A review page for loose work
    theme: dispatch
    priority: 3
    size: XS
    brief: The workflow promises loose work a review page and only your own config says how to make one.
  dispatch-scripts-under-test:
    name: Tests for the dispatch scripts
    theme: dispatch
    priority: 4
    size: S
    brief: Nothing tests the dispatch scripts or the review script; one wrong line would put a wrong range on a review page unnoticed.
  dispatch-comments:
    name: Shorter comments in dispatch
    theme: dispatch
    priority: 4
    size: XS
    brief: A third of each dispatch script is comments explaining the workflow; they shrink to what the code does.
  skill-driver:
    name: A before-and-after driver for skills
    theme: dispatch
    priority: 4
    size: S
    brief: Run one prompt against two versions of a skill and diff what the sessions did. The ticket needs rewriting first.

  runner-resumes-early-stops:
    name: Resume a worker that stopped early
    theme: dispatch
    priority: 2
    size: XS
    brief: A worker that exits cleanly while its ticket still says claimed has stopped early; the runner resumes it with `continue`.

  # bigger questions
  skills-holistic-pass:
    name: A pass over all the skills
    theme: later
    priority: 3
    size: XL
    brief: Read every skill and help text as a whole and cut what is doubled or in the wrong file. Best after the dispatch flow is drawn.
  one-tracker-per-user:
    name: One tracker for all your repos
    theme: later
    priority: 4
    size: L
    brief: A workspace repo holding every project's tickets, with research committed. The cost is that tickets stop living beside their code.
  best-of-n:
    name: Several workers, one ticket
    theme: later
    priority: 5
    size: L
    brief: Several workers build the same ticket and an agent merges the best. The hard part is making them differ.
  retro-semi-automated:
    name: Retrospectives from past sessions
    theme: later
    priority: 5
    size: L
    brief: Retros that read indexed sessions and propose workflow fixes with little of your attention.
  one-flow-open-rulings:
    name: Three prose-rule rulings
    theme: later
    priority: 4
    size: XS
    brief: Small calls on the prose rules the reply checker applies; recommendations are in the ticket.
  mutmut-upstream-issues:
    name: Two more mutmut bug reports
    theme: later
    priority: 4
    size: XS
    brief: Three are filed; two wait for your OK to post.

# PROTOTYPE: a ticket that would be filed as proposed, in place of the queue entry that asked whether to file it
virtual:
  runner-resumes-early-stops:
    title: The runner resumes a worker that stopped early
    status: proposed
    body: |
      Cut from the figures-and-demos close-out, 2026-09-22: the whole-feature review's worker exited twice with exit 0 while its ticket still said `claimed`, both times ending its turn while its own demo runs were going. `run-worker.sh` retries only on a nonzero exit, so the orchestrator resumed it by hand.

      ## What to build

      The runner reads the ticket's status after a clean exit; a ticket still `claimed` is resumed with `continue`, counted against the same attempt budget as a crash.
