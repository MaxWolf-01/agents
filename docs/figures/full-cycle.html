<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mx: the full cycle</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --paper:light-dark(#f5f5f5,#2d3142); --paper2:light-dark(#ececec,#393e53); --node:light-dark(#ffffff,#393e53);
  --ink:light-dark(#2d3142,#f5f5f5); --muted:light-dark(#4f5d75,#bfc0c0); --soft:light-dark(#7a8399,#8e98ac);
  --rule:light-dark(rgba(45,49,66,.12),rgba(245,245,245,.12));
  --accent:light-dark(#eb6c36,#f08a59); --accent-tint:light-dark(rgba(235,108,54,.08),rgba(240,138,89,.10));
  --wash-bar:light-dark(rgba(45,49,66,.05),rgba(245,245,245,.05));
}
body{background:var(--paper); color:var(--ink); font-family:'Geist',sans-serif; margin:0; padding:32px 56px 24px;}
svg{display:block; width:100%; height:auto;}
.mask{fill:var(--paper);}
.card{fill:var(--node); stroke:var(--ink); stroke-width:1;}
.card-focal{fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2;}
.card-ghost{fill:var(--paper2); stroke:var(--rule); stroke-width:1;}
.bar{fill:var(--wash-bar); stroke:var(--muted); stroke-width:.8;}
.flow{fill:none; stroke:var(--muted); stroke-width:1.2;}
.flow-accent{fill:none; stroke:var(--accent); stroke-width:1.2; stroke-dasharray:5 4;}
.spoke{fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:5 4;}
.gate{stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; opacity:.7;}
.m-muted{fill:var(--muted);} .m-accent{fill:var(--accent);}
text{fill:var(--ink);}
.name{font:600 12px 'Geist',sans-serif;}
.barname{font:600 11px 'Geist',sans-serif;}
.cmd{font:400 9px 'Geist Mono',monospace; fill:var(--muted);}
.cmd8{font:400 8px 'Geist Mono',monospace; fill:var(--muted);}
.note{font:400 9px 'Geist',sans-serif; fill:var(--soft);}
.eb{font:500 8px 'Geist Mono',monospace; letter-spacing:.18em; fill:var(--muted);}
.al{font:400 8px 'Geist Mono',monospace; letter-spacing:.06em; fill:var(--muted);}
.al-accent{font:400 8px 'Geist Mono',monospace; letter-spacing:.06em; fill:var(--accent);}
.rule{stroke:var(--rule); stroke-width:1;}
.legend-text{font:400 8px 'Geist Mono',monospace; letter-spacing:.05em; fill:var(--muted);}
.topbar{display:flex; justify-content:flex-end; margin:0 0 8px;}
.scheme{flex:none; font:500 8px 'Geist Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); background:var(--paper2); border:1px solid var(--rule); border-radius:6px; padding:5px 10px; cursor:pointer;}
.scheme:hover{color:var(--ink);}
</style>
</head>
<body>
<header class="topbar">
  <button class="scheme"></button>
</header>

<svg viewBox="0 56 1200 584" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="m-muted"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="m-accent"/>
    </marker>
  </defs>

  <!-- gate (zone layer) -->
  <line class="gate" x1="512" y1="96" x2="512" y2="240"/>

  <!-- connectors: the flow -->
  <path class="flow" d="M 152,88 V 116" marker-end="url(#arrow)"/>
  <path class="flow" d="M 240,176 H 298" marker-end="url(#arrow)"/>
  <path class="flow" d="M 480,176 H 538" marker-end="url(#arrow)"/>
  <path class="flow" d="M 720,176 H 778" marker-end="url(#arrow)"/>
  <path class="flow" d="M 960,176 H 1018" marker-end="url(#arrow)"/>
  <path class="flow" d="M 848,232 V 282" marker-end="url(#arrow)"/>
  <path class="flow" d="M 1112,232 V 282" marker-end="url(#arrow)"/>
  <path class="flow" d="M 960,340 H 1018" marker-end="url(#arrow)"/>

  <!-- spokes: what gets written to the board -->
  <path class="spoke" d="M 632,232 V 282" marker-end="url(#arrow)"/>
  <path class="spoke" d="M 800,232 V 244 Q 800,252 792,252 H 712 Q 704,252 704,260 V 282" marker-end="url(#arrow)"/>

  <!-- feedback rails -->
  <path class="flow-accent" d="M 1112,392 V 432 Q 1112,440 1104,440 H 568 Q 560,440 560,432 V 398" marker-end="url(#arrow-accent)"/>
  <path class="flow-accent" d="M 560,440 H 200 Q 192,440 192,432 V 238" marker-end="url(#arrow-accent)"/>
  <path class="flow-accent" d="M 124,472 V 238" marker-end="url(#arrow-accent)"/>

  <!-- nodes -->
  <rect class="card" x="64" y="120" width="176" height="112" rx="6"/>
  <rect class="card" x="304" y="120" width="176" height="112" rx="6"/>
  <rect class="card" x="544" y="120" width="176" height="112" rx="6"/>
  <rect class="card-ghost" x="800" y="104" width="176" height="16" rx="6"/>
  <rect class="card-ghost" x="792" y="112" width="176" height="16" rx="6"/>
  <rect class="card-focal" x="784" y="120" width="176" height="112" rx="6"/>
  <rect class="card" x="1024" y="120" width="176" height="112" rx="6"/>
  <rect class="bar" x="304" y="288" width="416" height="104" rx="6"/>
  <rect class="card" x="784" y="288" width="176" height="104" rx="6"/>
  <rect class="card" x="1024" y="288" width="176" height="104" rx="6"/>
  <rect class="card" x="64" y="472" width="208" height="76" rx="6"/>

  <!-- durable docs bar: two segments -->
  <rect class="bar" x="304" y="480" width="428" height="52" rx="4"/>
  <rect class="bar" x="744" y="480" width="456" height="52" rx="4"/>

  <!-- labels -->
  <text class="eb" x="64" y="80">AN INTENT, A BRIEF, A BUG REPORT</text>

  <text class="name" x="76" y="144">Sharpen the intent</text>
  <text class="cmd" x="76" y="160">/mx:grilling</text>
  <text class="note" x="76" y="178">each round shows the whole design</text>
  <text class="note" x="76" y="192">and puts its open questions to you;</text>
  <text class="note" x="76" y="206">terms and hard-to-reverse decisions</text>
  <text class="note" x="76" y="220">go to GLOSSARY.md and decisions/</text>

  <text class="name" x="316" y="144">The ticket</text>
  <text class="cmd" x="316" y="160">agent/tickets/&lt;slug&gt;.md</text>
  <text class="note" x="316" y="178">rewritten every round: the brief,</text>
  <text class="note" x="316" y="192">properties, calls marked by who</text>
  <text class="note" x="316" y="206">made them; questions that outlast</text>
  <text class="note" x="316" y="220">a session leave as child tickets</text>

  <text class="name" x="556" y="144">Cut into child tickets</text>
  <text class="cmd" x="556" y="160">/mx:tracker, SLICING.md</text>
  <text class="note" x="556" y="178">vertical slices, blocking edges,</text>
  <text class="note" x="556" y="192">hinges marked, filed proposed;</text>
  <text class="note" x="556" y="206">calls you have not ruled on go to</text>
  <text class="note" x="556" y="220">the workers as assumptions</text>

  <text class="name" x="796" y="144">Dispatch the tickets</text>
  <text class="cmd" x="796" y="160">/mx:dispatch</text>
  <text class="note" x="796" y="178">one orchestrator, a worker per</text>
  <text class="note" x="796" y="192">ticket in its own worktree; it</text>
  <text class="note" x="796" y="206">reads each build and merges it</text>
  <text class="note" x="796" y="220">into the parent ticket's branch</text>

  <text class="name" x="1036" y="144">Close-out</text>
  <text class="cmd" x="1036" y="160">suite, review, debrief</text>
  <text class="note" x="1036" y="178">full suite on the parent's branch,</text>
  <text class="note" x="1036" y="192">then a full code-review of it as</text>
  <text class="note" x="1036" y="206">one more child ticket, then the</text>
  <text class="note" x="1036" y="220">debrief; you rule on the tree whole</text>

  <text class="name" x="316" y="312">The board</text>
  <text class="cmd" x="316" y="328">board, agent/board.html</text>
  <text class="note" x="316" y="346">every ticket in its tree, the dependency graphs, the frontier, the review pages</text>
  <text class="note" x="316" y="360">the needs-me group: every build in review, every question waiting on you</text>
  <text class="note" x="316" y="374">a proposed ticket is built like an open one; what waits is your ruling</text>

  <text class="name" x="796" y="312">Each landed slice</text>
  <text class="cmd" x="796" y="328">review page, show, QA</text>
  <text class="note" x="796" y="346">one show, built by a fork of the</text>
  <text class="note" x="796" y="360">session, shows the calls that are</text>
  <text class="note" x="796" y="374">yours; you drive it on your machine</text>

  <text class="name" x="1036" y="312">Review session</text>
  <text class="cmd" x="1036" y="328">drive the app, then grill</text>
  <text class="note" x="1036" y="346">scheduled at first drivable;</text>
  <text class="note" x="1036" y="360">the agent fixes defects and files</text>
  <text class="note" x="1036" y="374">tickets; you rule on proposals</text>

  <text class="name" x="80" y="496">Codebase health</text>
  <text class="cmd8" x="80" y="512">/mx:improve-codebase-architecture</text>
  <text class="note" x="80" y="526">a survey for modules to deepen,</text>
  <text class="note" x="80" y="539">grilled in order of impact</text>

  <text class="barname" x="320" y="502">GLOSSARY.md</text>
  <text class="note" x="320" y="518">the domain's words, edited in place; every session and worker reads it</text>
  <text class="barname" x="760" y="502">decisions/</text>
  <text class="note" x="760" y="518">ADRs, append-only: one hard-to-reverse decision and why; no build contradicts one</text>

  <!-- asides + arrow labels -->
  <text class="note" x="304" y="252">one slice means no cut:</text>
  <text class="note" x="304" y="266">the ticket itself is built</text>

  <rect class="mask" x="438" y="82" width="148" height="16" rx="4"/>
  <text class="eb" x="512" y="93" text-anchor="middle">FRONTIER EMPTY</text>

  <rect class="mask" x="856" y="242" width="52" height="14" rx="4"/>
  <text class="al" x="860" y="252">LANDED</text>

  <rect class="mask" x="1120" y="242" width="72" height="14" rx="4"/>
  <text class="al" x="1124" y="252">THE DEBRIEF</text>

  <rect class="mask" x="962" y="320" width="56" height="14" rx="4"/>
  <text class="al" x="990" y="330" text-anchor="middle">FINDINGS</text>

  <rect class="mask" x="652" y="420" width="84" height="14" rx="4"/>
  <text class="al-accent" x="660" y="430">NEW &amp; PROPOSED</text>

  <rect class="mask" x="330" y="420" width="124" height="14" rx="4"/>
  <text class="al-accent" x="392" y="430" text-anchor="middle">REOPENED DECISIONS</text>

  <rect class="mask" x="136" y="292" width="48" height="14" rx="4"/>
  <text class="al-accent" x="140" y="302">NEW IDEA</text>

  <!-- legend -->
  <line class="rule" x1="64" y1="588" x2="1200" y2="588"/>
  <rect class="card-focal" x="64" y="606" width="24" height="12" rx="3"/>
  <text class="legend-text" x="96" y="615">the unattended stretch</text>
  <rect class="card-ghost" x="236" y="602" width="20" height="14" rx="3"/>
  <rect class="card" x="232" y="606" width="20" height="14" rx="3"/>
  <text class="legend-text" x="264" y="615">one worker per ticket, fresh context</text>
  <line class="flow" x1="470" y1="611" x2="506" y2="611" marker-end="url(#arrow)"/>
  <text class="legend-text" x="514" y="615">the flow</text>
  <line class="spoke" x1="580" y1="611" x2="616" y2="611"/>
  <text class="legend-text" x="624" y="615">written to the board</text>
  <line class="flow-accent" x1="750" y1="611" x2="786" y2="611"/>
  <text class="legend-text" x="794" y="615">feedback: the board absorbs it</text>
  <rect class="bar" x="968" y="606" width="24" height="12" rx="3"/>
  <text class="legend-text" x="1000" y="615">the board and the durable docs</text>
</svg>
<script>
const root = document.documentElement, button = document.querySelector('.scheme');
let dark = matchMedia('(prefers-color-scheme: dark)').matches;
const apply = () => {
  root.style.colorScheme = dark ? 'dark' : 'light';
  button.textContent = dark ? 'Light' : 'Dark';
  button.setAttribute('aria-label', `Switch to ${dark ? 'light' : 'dark'} mode`);
};
button.addEventListener('click', () => { dark = !dark; apply(); });
apply();
</script>
</body>
</html>
