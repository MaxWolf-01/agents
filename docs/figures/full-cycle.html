<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mx: the full cycle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* the house tokens (mx/skills/house-style/tokens.css), the parts this figure uses */
:root {
  color-scheme: light dark;
  --ground: light-dark(#f4e4cd, #1a1714);
  --ground-2: light-dark(#eddabe, #201c18);
  --edge: light-dark(#cfbca3, #4a433b);
  --muted: light-dark(#5e5650, #b0a89e);
  --body: light-dark(#37261d, #ede3d2);
  --strong: light-dark(#22140b, #faf2dc);
  --accent: light-dark(#426724, #75a252);
  --accent-2: light-dark(#674806, #cdb78a);
  --wash: light-dark(rgb(66 103 36 / 0.16), rgb(117 162 82 / 0.22));
  --wash-ink: color-mix(in srgb, var(--muted) 6%, transparent);
  --mark: light-dark(rgb(168 139 81 / 0.35), rgb(205 183 138 / 0.35));
  --font-body: "Newsreader", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --size-body: 19px;
  --leading-body: 1.62;
}
[data-theme="day"] { color-scheme: light; }
[data-theme="night"] { color-scheme: dark; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--body);
  font: 400 var(--size-body) / var(--leading-body) var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: var(--mark); }
.v-title { font-weight: 600; font-size: clamp(1.875rem, 3.5vw, 2.5rem); line-height: 1.12; letter-spacing: -0.022em; color: var(--strong); }
.v-meta { font-family: var(--font-mono); font-size: 0.8125rem; line-height: 1.5; color: var(--muted); font-variant-numeric: tabular-nums; }

/* the page */
body { padding: 48px 56px 32px; }
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 32px; }
h1 { margin: 0; }
.sub { margin: 10px 0 36px; font-size: 15px; line-height: 1.5; color: var(--muted); max-width: 920px; }
.scheme { display: inline-flex; padding: 0.25rem; border: 0; background: none; color: var(--muted); cursor: pointer; transition: color 150ms; }
.scheme:hover { color: var(--accent); }
[data-theme="night"] .sun, [data-theme="day"] .moon { display: none; }
svg.fig { display: block; width: 100%; height: auto; }

/* the figure */
.band1 { fill: color-mix(in srgb, var(--muted) 6%, transparent); }
.band2 { fill: color-mix(in srgb, var(--muted) 10%, transparent); }
.band3 { fill: color-mix(in srgb, var(--muted) 14%, transparent); }
.band4 { fill: color-mix(in srgb, var(--muted) 18%, transparent); }
.band5 { fill: color-mix(in srgb, var(--muted) 22%, transparent); }
.hair { stroke: var(--edge); stroke-width: 1; }
.card { fill: var(--ground-2); stroke: var(--body); stroke-width: 1; }
.deck { fill: var(--ground-2); stroke: var(--muted); stroke-width: .8; }
.absent { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.focal { fill: var(--wash); stroke: var(--accent); stroke-width: 1.2; }
.zone { fill: var(--wash-ink); stroke: var(--muted); stroke-width: .8; }
.flow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.m-muted { fill: var(--muted); }
text { fill: var(--body); }
.band-label { font: 400 13px var(--font-mono); fill: var(--muted); }
.lane { font: 400 13px var(--font-mono); fill: var(--muted); }
.name { font: 600 14px var(--font-body); fill: var(--body); }
.name-focal { font: 600 14px var(--font-body); fill: var(--accent); }
.role { font: 400 13px var(--font-body); fill: var(--body); }
.detail { font: 400 12px var(--font-mono); fill: var(--muted); }
.note { font: 400 13px var(--font-body); fill: var(--muted); }
.legend { font: 400 13px var(--font-mono); fill: var(--muted); }
.store { fill: var(--ground-2); stroke: var(--muted); stroke-width: 1; }
.back { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
.gate { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; }
.arrow-label { font: 400 12px var(--font-body); fill: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1 class="v-title">The full cycle, from an intent to shipped work</h1>
    <p class="sub">Grilling writes the ticket, dispatch builds its child tickets, and what you find in the landed work comes back as new tickets.</p>
  </div>
  <button class="scheme" id="scheme" aria-label="switch to night">
    <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
  </button>
</header>

<svg class="fig" viewBox="0 0 1200 528" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="m-muted"/>
    </marker>
  </defs>

  <!-- the gate between grilling and the cut -->
  <line class="gate" x1="476" y1="28" x2="476" y2="152"/>

  <!-- hairline above the legend -->
  <line class="hair" x1="0" y1="480" x2="1200" y2="480"/>

  <!-- connectors: the flow -->
  <path class="flow" d="M 104,24 V 64" marker-end="url(#arrow)"/>
  <path class="flow" d="M 208,104 H 248" marker-end="url(#arrow)"/>
  <path class="flow" d="M 456,104 H 496" marker-end="url(#arrow)"/>
  <path class="flow" d="M 704,104 H 744" marker-end="url(#arrow)"/>
  <path class="flow" d="M 952,104 H 992" marker-end="url(#arrow)"/>
  <path class="flow" d="M 848,144 V 208" marker-end="url(#arrow)"/>
  <path class="flow" d="M 1096,144 V 208" marker-end="url(#arrow)"/>
  <path class="flow" d="M 952,248 H 992" marker-end="url(#arrow)"/>

  <!-- connectors: back into the work -->
  <path class="back" d="M 248,248 H 152 Q 144,248 144,240 V 144" marker-end="url(#arrow)"/>
  <path class="back" d="M 1048,288 V 320 Q 1048,328 1040,328 H 72 Q 64,328 64,320 V 144" marker-end="url(#arrow)"/>
  <path class="back" d="M 1144,288 V 360" marker-end="url(#arrow)"/>

  <!-- nodes: the build -->
  <rect class="focal" x="0" y="64" width="208" height="80" rx="6"/>
  <rect class="card" x="248" y="64" width="208" height="80" rx="6"/>
  <rect class="card" x="496" y="64" width="208" height="80" rx="6"/>
  <rect class="deck" x="760" y="48" width="176" height="16" rx="6"/>
  <rect class="deck" x="752" y="56" width="192" height="16" rx="6"/>
  <rect class="card" x="744" y="64" width="208" height="80" rx="6"/>
  <rect class="focal" x="992" y="64" width="208" height="80" rx="6"/>

  <!-- nodes: what reaches you -->
  <rect class="card" x="248" y="208" width="456" height="80" rx="6"/>
  <rect class="focal" x="744" y="208" width="208" height="80" rx="6"/>
  <rect class="focal" x="992" y="208" width="208" height="80" rx="6"/>

  <!-- nodes: the board and the durable docs -->
  <rect class="store" x="0" y="360" width="208" height="80" rx="6"/>
  <rect class="store" x="248" y="360" width="208" height="80" rx="6"/>
  <rect class="store" x="496" y="360" width="704" height="80" rx="8"/>
  <rect fill="var(--ground)" x="508" y="368" width="196" height="64" rx="6"/>
  <rect class="focal" x="508" y="368" width="196" height="64" rx="6"/>

  <!-- labels: above the row -->
  <text class="lane" x="0" y="16">an intent, a brief, a bug report</text>
  <text class="lane" x="476" y="16" text-anchor="middle">frontier empty</text>

  <!-- labels: the build -->
  <text class="name-focal" x="12" y="88">grilling</text>
  <text class="role" x="12" y="105">the design, then your questions</text>
  <text class="detail" x="12" y="122">/mx:grilling</text>

  <text class="name" x="260" y="88">the ticket</text>
  <text class="role" x="260" y="105">rewritten every round</text>
  <text class="detail" x="260" y="122">agent/tickets/&lt;slug&gt;.md</text>

  <text class="name" x="508" y="88">cut into child tickets</text>
  <text class="role" x="508" y="105">vertical slices, hinges marked</text>
  <text class="detail" x="508" y="122">/mx:tracker, SLICING.md</text>

  <text class="name" x="756" y="88">dispatch</text>
  <text class="role" x="756" y="105">a worker per frontier ticket</text>
  <text class="detail" x="756" y="122">/mx:dispatch</text>

  <text class="name-focal" x="1004" y="88">close-out</text>
  <text class="role" x="1004" y="105">you rule the tree whole</text>
  <text class="note" x="1004" y="122">full suite, review, debrief</text>

  <text class="note" x="248" y="172">one slice means no cut:</text>
  <text class="note" x="248" y="189">the ticket itself is built</text>

  <text class="arrow-label" x="856" y="180">landed</text>
  <text class="arrow-label" x="1104" y="180">debrief</text>

  <!-- labels: what reaches you -->
  <text class="name" x="260" y="232">codebase health</text>
  <text class="role" x="260" y="249">a survey for modules to deepen, grilled in order of impact</text>
  <text class="detail" x="260" y="266">/mx:improve-codebase-architecture</text>

  <text class="name-focal" x="756" y="232">each landed slice</text>
  <text class="role" x="756" y="249">the calls it shows you, then QA</text>
  <text class="note" x="756" y="266">review page and one show</text>

  <text class="name-focal" x="1004" y="232">review session</text>
  <text class="role" x="1004" y="249">you drive it, then grilling</text>
  <text class="note" x="1004" y="266">from the first drivable slice</text>

  <text class="arrow-label" x="200" y="240" text-anchor="middle">candidates</text>
  <text class="arrow-label" x="600" y="320" text-anchor="middle">reopened calls</text>
  <text class="arrow-label" x="1136" y="328" text-anchor="end">new tickets</text>

  <!-- labels: the board and the durable docs -->
  <text class="name" x="12" y="384">the glossary</text>
  <text class="role" x="12" y="401">terms settled in grilling</text>
  <text class="detail" x="12" y="418">GLOSSARY.md</text>

  <text class="name" x="260" y="384">the decisions</text>
  <text class="role" x="260" y="401">hard-to-reverse, append-only</text>
  <text class="detail" x="260" y="418">decisions/</text>

  <text class="name-focal" x="520" y="392">the needs-me group</text>
  <text class="role" x="520" y="409">every question waiting on you</text>

  <text class="name" x="756" y="384">the board</text>
  <text class="role" x="756" y="401">every ticket, its tree, the frontier, the review pages</text>
  <text class="detail" x="756" y="418">agent/board.html</text>

  <!-- legend -->
  <rect class="focal" x="0" y="496" width="24" height="14" rx="3"/>
  <text class="legend" x="36" y="508">your stations, and no others</text>
  <rect class="deck" x="296" y="492" width="20" height="14" rx="3"/>
  <rect class="card" x="292" y="496" width="24" height="14" rx="3"/>
  <text class="legend" x="328" y="508">a fresh worker per ticket</text>
  <line class="flow" x1="564" y1="503" x2="596" y2="503" marker-end="url(#arrow)"/>
  <text class="legend" x="608" y="508">the flow</text>
  <line class="back" x1="708" y1="503" x2="740" y2="503" marker-end="url(#arrow)"/>
  <text class="legend" x="752" y="508">back into the work</text>
  <rect class="store" x="932" y="496" width="24" height="14" rx="3"/>
  <text class="legend" x="968" y="508">the board and the docs</text>
</svg>
<script>
  const root = document.documentElement
  const theme = new URLSearchParams(location.search).get("theme")
  const dark = theme ? theme === "night" : matchMedia("(prefers-color-scheme: dark)").matches
  const set = (night) => {
    root.dataset.theme = night ? "night" : "day"
    document.getElementById("scheme").setAttribute("aria-label", night ? "switch to day" : "switch to night")
  }
  document.getElementById("scheme").addEventListener("click", () => set(root.dataset.theme !== "night"))
  set(dark)
</script>
</body>
</html>
