<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mx: one flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* the house tokens (mx/skills/house-style/tokens.css), the parts this figure uses */
:root {
  color-scheme: light dark;
  --ground: light-dark(#f4e4cd, #1a1714);
  --ground-2: light-dark(#eddabe, #201c18);
  --edge: light-dark(#cfbca3, #4a433b);
  --muted: light-dark(#5e5650, #b0a89e);
  --body: light-dark(#37261d, #ede3d2);
  --strong: light-dark(#22140b, #faf2dc);
  --accent: light-dark(#426724, #75a252);
  --accent-2: light-dark(#674806, #cdb78a);
  --wash: light-dark(rgb(66 103 36 / 0.16), rgb(117 162 82 / 0.22));
  --wash-ink: color-mix(in srgb, var(--muted) 6%, transparent);
  --mark: light-dark(rgb(168 139 81 / 0.35), rgb(205 183 138 / 0.35));
  --font-body: "Newsreader", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --size-body: 19px;
  --leading-body: 1.62;
}
[data-theme="day"] { color-scheme: light; }
[data-theme="night"] { color-scheme: dark; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--body);
  font: 400 var(--size-body) / var(--leading-body) var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: var(--mark); }
.v-title { font-weight: 600; font-size: clamp(1.875rem, 3.5vw, 2.5rem); line-height: 1.12; letter-spacing: -0.022em; color: var(--strong); }
.v-meta { font-family: var(--font-mono); font-size: 0.8125rem; line-height: 1.5; color: var(--muted); font-variant-numeric: tabular-nums; }

/* the page */
body { padding: 48px 56px 32px; }
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 32px; }
h1 { margin: 0; }
.sub { margin: 10px 0 36px; font-size: 15px; line-height: 1.5; color: var(--muted); max-width: 920px; }
.scheme { display: inline-flex; padding: 0.25rem; border: 0; background: none; color: var(--muted); cursor: pointer; transition: color 150ms; }
.scheme:hover { color: var(--accent); }
[data-theme="night"] .sun, [data-theme="day"] .moon { display: none; }
svg.fig { display: block; width: 100%; height: auto; }

/* the figure */
.band1 { fill: color-mix(in srgb, var(--muted) 6%, transparent); }
.band2 { fill: color-mix(in srgb, var(--muted) 10%, transparent); }
.band3 { fill: color-mix(in srgb, var(--muted) 14%, transparent); }
.band4 { fill: color-mix(in srgb, var(--muted) 18%, transparent); }
.band5 { fill: color-mix(in srgb, var(--muted) 22%, transparent); }
.hair { stroke: var(--edge); stroke-width: 1; }
.card { fill: var(--ground-2); stroke: var(--body); stroke-width: 1; }
.deck { fill: var(--ground-2); stroke: var(--muted); stroke-width: .8; }
.absent { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.focal { fill: var(--wash); stroke: var(--accent); stroke-width: 1.2; }
.zone { fill: var(--wash-ink); stroke: var(--muted); stroke-width: .8; }
.flow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.m-muted { fill: var(--muted); }
text { fill: var(--body); }
.band-label { font: 400 13px var(--font-mono); fill: var(--muted); }
.lane { font: 400 13px var(--font-mono); fill: var(--muted); }
.name { font: 600 14px var(--font-body); fill: var(--body); }
.name-focal { font: 600 14px var(--font-body); fill: var(--accent); }
.role { font: 400 13px var(--font-body); fill: var(--body); }
.detail { font: 400 12px var(--font-mono); fill: var(--muted); }
.note { font: 400 13px var(--font-body); fill: var(--muted); }
.legend { font: 400 13px var(--font-mono); fill: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1 class="v-title">One flow, from intent to landing</h1>
    <p class="sub">Every intent enters in chat, and how much of its design lands on disk decides who builds it and who reviews it.</p>
  </div>
  <button class="scheme" id="scheme" aria-label="switch to night">
    <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
  </button>
</header>

<svg class="fig" viewBox="0 0 1200 784" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="m-muted"/>
    </marker>
  </defs>

  <!-- phase banner: the columns -->
  <polygon class="band1" points="0,0 228,0 240,16 228,32 0,32"/>
  <polygon class="band2" points="248,0 472,0 484,16 472,32 248,32 260,16"/>
  <polygon class="band3" points="492,0 708,0 720,16 708,32 492,32 504,16"/>
  <polygon class="band4" points="728,0 944,0 956,16 944,32 728,32 740,16"/>
  <polygon class="band5" points="964,0 1188,0 1200,16 1188,32 964,32 976,16"/>

  <!-- hairlines between the rows, the dials and the legend -->
  <line class="hair" x1="272" y1="192" x2="1200" y2="192"/>
  <line class="hair" x1="272" y1="332" x2="1200" y2="332"/>
  <line class="hair" x1="0" y1="604" x2="1200" y2="604"/>
  <line class="hair" x1="0" y1="736" x2="1200" y2="736"/>

  <!-- connectors -->
  <path class="flow" d="M 108,200 V 228" marker-end="url(#arrow)"/>
  <path class="flow" d="M 216,248 H 236 Q 244,248 244,240 V 136 Q 244,128 252,128 H 272" marker-end="url(#arrow)"/>
  <path class="flow" d="M 216,268 H 272" marker-end="url(#arrow)"/>
  <path class="flow" d="M 216,288 H 236 Q 244,288 244,296 V 400 Q 244,408 252,408 H 272" marker-end="url(#arrow)"/>
  <path class="flow" d="M 472,128 H 508" marker-end="url(#arrow)"/>
  <path class="flow" d="M 708,128 H 744" marker-end="url(#arrow)"/>
  <path class="flow" d="M 944,128 H 980" marker-end="url(#arrow)"/>
  <path class="flow" d="M 472,268 H 508" marker-end="url(#arrow)"/>
  <path class="flow" d="M 708,268 H 744" marker-end="url(#arrow)"/>
  <path class="flow" d="M 944,268 H 980" marker-end="url(#arrow)"/>
  <path class="flow" d="M 472,408 H 508" marker-end="url(#arrow)"/>
  <path class="flow" d="M 708,408 H 744" marker-end="url(#arrow)"/>
  <path class="flow" d="M 944,408 H 980" marker-end="url(#arrow)"/>
  <path class="flow" d="M 944,524 H 980" marker-end="url(#arrow)"/>

  <!-- nodes: chat -->
  <rect class="focal" x="0" y="88" width="216" height="112" rx="6"/>
  <rect class="card" x="0" y="228" width="216" height="80" rx="6"/>

  <!-- nodes: loose -->
  <rect class="absent" x="272" y="88" width="200" height="80" rx="6"/>
  <rect class="absent" x="508" y="88" width="200" height="80" rx="6"/>
  <rect class="absent" x="744" y="88" width="200" height="80" rx="6"/>
  <rect class="focal" x="980" y="88" width="220" height="80" rx="6"/>

  <!-- nodes: a ticket -->
  <rect class="card" x="272" y="228" width="200" height="80" rx="6"/>
  <rect class="card" x="508" y="228" width="200" height="80" rx="6"/>
  <rect class="card" x="744" y="228" width="200" height="80" rx="6"/>
  <rect class="focal" x="980" y="228" width="220" height="80" rx="6"/>

  <!-- nodes: child tickets -->
  <rect class="card" x="272" y="368" width="200" height="80" rx="6"/>
  <rect class="deck" x="524" y="352" width="168" height="16" rx="6"/>
  <rect class="deck" x="516" y="360" width="184" height="16" rx="6"/>
  <rect class="card" x="508" y="368" width="200" height="80" rx="6"/>
  <rect class="card" x="744" y="368" width="200" height="80" rx="6"/>
  <rect class="focal" x="980" y="368" width="220" height="80" rx="6"/>

  <!-- nodes: the orchestrator and the needs-me group -->
  <rect class="zone" x="508" y="476" width="436" height="96" rx="8"/>
  <rect class="focal" x="980" y="476" width="220" height="96" rx="6"/>

  <!-- labels: banner -->
  <text class="band-label" x="112" y="21" text-anchor="middle">chat</text>
  <text class="band-label" x="372" y="21" text-anchor="middle">brief</text>
  <text class="band-label" x="608" y="21" text-anchor="middle">worker</text>
  <text class="band-label" x="844" y="21" text-anchor="middle">review</text>
  <text class="band-label" x="1090" y="21" text-anchor="middle">land</text>

  <!-- labels: the answer each row stands for -->
  <text class="lane" x="272" y="76">no: the instruction is the change</text>
  <text class="lane" x="272" y="216">yes: one worker's worth</text>
  <text class="lane" x="272" y="356">yes: more than one worker</text>

  <!-- labels: chat -->
  <text class="name-focal" x="12" y="112">the gate</text>
  <text class="note" x="12" y="129">draft the ticket, then route it</text>
  <text class="role" x="12" y="150">fog: grill it</text>
  <text class="role" x="12" y="167">rival shapes: prototype or draw</text>
  <text class="role" x="12" y="184">one sensible shape: build it</text>

  <text class="name" x="12" y="252">loose, or a ticket?</text>
  <text class="role" x="12" y="269">would a stranger need a brief?</text>
  <text class="note" x="12" y="286">the agent answers it</text>

  <text class="lane" x="0" y="392">the build never waits</text>
  <text class="note" x="0" y="412">it starts once no question is left</text>
  <text class="note" x="0" y="429">to ask you; calls you have not ruled</text>
  <text class="note" x="0" y="446">on stay marked in the ticket</text>

  <text class="lane" x="0" y="500">turn review</text>
  <text class="note" x="0" y="520">a model reviews each turn's prose</text>
  <text class="note" x="0" y="537">while the turn still runs</text>

  <!-- labels: loose -->
  <text class="name" x="284" y="112">no brief</text>
  <text class="role" x="284" y="129">a stranger could apply it</text>
  <text class="note" x="284" y="146">a keybinding, a version bump</text>

  <text class="name" x="520" y="112">this session</text>
  <text class="role" x="520" y="129">commits on its own branch</text>
  <text class="detail" x="520" y="146">Workflow-stage: loose</text>

  <text class="name" x="756" y="112">no agent review</text>
  <text class="role" x="756" y="129">the change was dictated</text>
  <text class="note" x="756" y="146">it needed no judgment</text>

  <text class="name-focal" x="992" y="112">review page and show</text>
  <text class="role" x="992" y="129">you read it, the session lands it</text>
  <text class="detail" x="992" y="146">agent/show/&lt;branch&gt;/</text>

  <!-- labels: a ticket -->
  <text class="name" x="284" y="252">a ticket</text>
  <text class="role" x="284" y="269">filed open, dispatched at once</text>
  <text class="detail" x="284" y="286">agent/tickets/&lt;slug&gt;.md</text>

  <text class="name" x="520" y="252">a fresh worker</text>
  <text class="role" x="520" y="269">builds, tests, commits a report</text>
  <text class="detail" x="520" y="286">/mx:dispatch</text>

  <text class="name" x="756" y="252">the worker's own review</text>
  <text class="role" x="756" y="269">light, or the full axes</text>
  <text class="detail" x="756" y="286">/mx:code-review</text>

  <text class="name-focal" x="992" y="252">your ruling, then QA</text>
  <text class="role" x="992" y="269">on the calls that are yours</text>
  <text class="note" x="992" y="286">accept, amend, redo or reject</text>

  <!-- labels: child tickets -->
  <text class="name" x="284" y="392">cut into child tickets</text>
  <text class="role" x="284" y="409">vertical slices, hinges marked</text>
  <text class="detail" x="284" y="426">/mx:tracker, SLICING.md</text>

  <text class="name" x="520" y="392">a worker per child ticket</text>
  <text class="role" x="520" y="409">one at a time, or in waves</text>
  <text class="note" x="520" y="426">on the parent's branch</text>

  <text class="name" x="756" y="392">two levels of review</text>
  <text class="role" x="756" y="409">each worker reviews its branch</text>
  <text class="note" x="756" y="426">then one level up, at close-out</text>

  <text class="name-focal" x="992" y="392">close-out, your ruling</text>
  <text class="role" x="992" y="409">the tree whole, a hinge alone</text>
  <text class="note" x="992" y="426">full suite, debrief, one show</text>

  <!-- labels: the orchestrator and the needs-me group -->
  <text class="name" x="520" y="500">one orchestrator per ticket or tree</text>
  <text class="role" x="520" y="517">claims, spawns, reads each build, merges it</text>
  <text class="role" x="520" y="534">sorts its calls: already yours, the agent's, yours to make</text>
  <text class="detail" x="520" y="553">/mx:dispatch</text>

  <text class="name-focal" x="992" y="500">the needs-me group</text>
  <text class="role" x="992" y="517">every question waiting on you</text>
  <text class="role" x="992" y="534">every build in review</text>
  <text class="detail" x="992" y="553">agent/board.html</text>

  <!-- labels: dials -->
  <text class="lane" x="0" y="636">the dials, one per column</text>
  <text class="name" x="0" y="668">grilling</text>
  <text class="note" x="0" y="686">none, one question, or rounds</text>
  <text class="note" x="0" y="703">over as many sessions as it takes</text>
  <text class="name" x="272" y="668">on disk</text>
  <text class="note" x="272" y="686">nothing, a ticket, or a ticket</text>
  <text class="note" x="272" y="703">cut into child tickets</text>
  <text class="name" x="508" y="668">worker</text>
  <text class="note" x="508" y="686">this session, or a fresh worker</text>
  <text class="note" x="508" y="703">per ticket, its host picked at spawn</text>
  <text class="name" x="744" y="668">review</text>
  <text class="note" x="744" y="686">none, light, or the full axes,</text>
  <text class="note" x="744" y="703">and one level up at a close-out</text>
  <text class="name" x="980" y="668">what sets them</text>
  <text class="note" x="980" y="686">what lands on disk decides who</text>
  <text class="note" x="980" y="703">builds it, and so who reviews it</text>

  <!-- legend -->
  <rect class="focal" x="0" y="756" width="24" height="14" rx="3"/>
  <text class="legend" x="36" y="768">your stations, and no others</text>
  <rect class="absent" x="300" y="756" width="24" height="14" rx="3"/>
  <text class="legend" x="336" y="768">done by the session itself</text>
  <rect class="deck" x="644" y="752" width="20" height="14" rx="3"/>
  <rect class="card" x="640" y="756" width="24" height="14" rx="3"/>
  <text class="legend" x="676" y="768">a fresh worker per ticket</text>
  <rect class="zone" x="924" y="756" width="24" height="14" rx="3"/>
  <text class="legend" x="960" y="768">the orchestrator</text>
</svg>
<script>
  const root = document.documentElement
  const theme = new URLSearchParams(location.search).get("theme")
  const dark = theme ? theme === "night" : matchMedia("(prefers-color-scheme: dark)").matches
  const set = (night) => {
    root.dataset.theme = night ? "night" : "day"
    document.getElementById("scheme").setAttribute("aria-label", night ? "switch to day" : "switch to night")
  }
  document.getElementById("scheme").addEventListener("click", () => set(root.dataset.theme !== "night"))
  set(dark)
</script>
</body>
</html>
