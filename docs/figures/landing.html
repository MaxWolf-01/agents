<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mx: a landing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The house tokens: parchment over brown ink by day, charcoal and sand by
   night, one moss accent for anything you can act on. Copy this file into the
   project, with the font <link> from the head of demo.html, and change what the
   project needs: the serif, the size and leading that fit it, the measure. The
   colours and the roles stay.

   Every colour but the series is a light-dark() pair. Without data-theme on
   the root the page follows the system; data-theme="day" or "night" pins it.
   The rules sit in the base and components layers, so a project's own CSS,
   and Tailwind's utilities, win over them without fighting specificity. */

:root {
  color-scheme: light dark;

  --ground: light-dark(#f4e4cd, #14110e);
  --ground-2: light-dark(#eddabe, #1b1713);
  --edge: light-dark(#cfbca3, #463f37);
  --muted: light-dark(#5e5650, #b0a89e);
  --body: light-dark(#37261d, #ede3d2);
  --strong: light-dark(#22140b, #faf2dc);
  --accent: light-dark(#426724, #75a252);
  --accent-2: light-dark(#674806, #cdb78a);
  --wash: light-dark(rgb(66 103 36 / 0.16), rgb(117 162 82 / 0.22));
  --wash-ink: color-mix(in srgb, var(--muted) 6%, transparent);
  --mark: light-dark(rgb(168 139 81 / 0.35), rgb(205 183 138 / 0.35));

  /* Muted on purpose, so five series sit quietly on either ground. The order
     keeps the two closest pairs, dusty blue and slate, sage and mustard, from
     ever sitting side by side. */
  --series-1: #9c6b50; /* rust */
  --series-2: #5e7a9b; /* dusty blue */
  --series-3: #b8915a; /* mustard */
  --series-4: #6e6479; /* slate */
  --series-5: #7c8f6f; /* sage */

  --font-body: "Newsreader", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --size-body: 19px;
  --leading-body: 1.62;
  --measure: 43rem;
  --page: 62rem;
  --radius: 6px;
}

[data-theme="day"] {
  color-scheme: light;
}

[data-theme="night"] {
  color-scheme: dark;
}

@layer base {
  body {
    margin: 0;
    background: var(--ground);
    color: var(--body);
    font: 400 var(--size-body) / var(--leading-body) var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection {
    background: var(--mark);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* A link in chrome (nav, back, next) is muted text that turns accent; a link
     in running text is accent and underlined, under .prose below. */
  a {
    color: inherit;
    text-decoration: none;
    transition: color 150ms;
  }

  a:hover {
    color: var(--accent);
  }

  code,
  kbd,
  pre {
    font-family: var(--font-mono);
  }

  code {
    font-size: 0.875em;
  }
}

/* Type by role, so a page asks for a heading rather than a size. */
@layer components {
  .v-title {
    font-weight: 600;
    font-size: clamp(1.875rem, 3.5vw, 2.5rem);
    line-height: 1.12;
    letter-spacing: -0.022em;
    color: var(--strong);
  }

  .v-h2 {
    font-weight: 600;
    font-size: 1.3em;
    line-height: 1.3;
    letter-spacing: -0.012em;
    color: var(--strong);
  }

  .v-h3 {
    font-weight: 600;
    font-size: 1.05em;
    line-height: 1.4;
    color: var(--strong);
  }

  .v-lead {
    font-size: 1.14em;
    line-height: 1.55;
  }

  .v-small {
    font-size: 0.92em;
    line-height: 1.6;
  }

  /* The monospace line: dates, counts, provenance, field labels. Lowercase. */
  .v-meta {
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    line-height: 1.5;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .v-num {
    font-family: var(--font-mono);
    font-size: 0.92em;
    font-variant-numeric: tabular-nums;
  }

  /* Running text, styled by tag: prose arrives as markup and should not need
     a class per paragraph. */
  .prose > * {
    max-width: var(--measure);
  }

  /* A table or a code block takes the width of the column the prose sits in
     rather than the measure: squeezed to the measure, its cells wrap. */
  .prose > table,
  .prose > pre {
    max-width: 100%;
  }

  .prose > * + * {
    margin-top: 1.1em;
  }

  .prose h2 {
    font-weight: 600;
    font-size: 1.3em;
    line-height: 1.3;
    letter-spacing: -0.012em;
    color: var(--strong);
    margin-top: 2.4em;
  }

  .prose h3 {
    font-weight: 600;
    font-size: 1.05em;
    color: var(--strong);
    margin-top: 1.8em;
  }

  .prose a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
  }

  .prose a:hover {
    text-decoration-color: var(--accent);
  }

  .prose strong {
    font-weight: 600;
    color: var(--strong);
  }

  .prose code {
    background: var(--ground-2);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }

  .prose ul,
  .prose ol {
    padding-left: 1.2em;
  }

  .prose li + li {
    margin-top: 0.4em;
  }

  .prose li::marker {
    color: var(--muted);
  }

  /* Block display lets a table too wide for a narrow window scroll inside
     itself instead of widening the page. */
  .prose table {
    display: block;
    width: max-content;
    overflow-x: auto;
    border-collapse: collapse;
  }

  .prose th,
  .prose td {
    padding: 0.45rem 1.75rem 0.45rem 0;
    text-align: left;
    vertical-align: baseline;
  }

  .prose th:last-child,
  .prose td:last-child {
    padding-right: 0;
  }

  .prose th {
    font: 400 0.8125rem / 1.5 var(--font-mono);
    color: var(--muted);
    border-bottom: 1px solid var(--muted);
  }

  .prose td {
    border-bottom: 1px solid var(--edge);
  }

  .prose tr:last-child td {
    border-bottom: 0;
  }

  .prose blockquote {
    margin: 0;
    border-left: 2px solid var(--edge);
    padding-left: 1.2em;
    color: var(--muted);
  }
}


/* The figure on the house tokens above. */
body { padding: 40px 56px 32px; }
header { display: flex; align-items: flex-start; gap: 2rem; }
h1 { margin: 0; }
.lead { margin: 12px 0 28px; max-width: 46rem; font-size: 15px; line-height: 1.5; color: var(--muted); }
.lead code { font-size: 13px; }
.scheme { margin-left: auto; display: inline-flex; padding: 0.25rem; border: 0; background: none; color: var(--muted); cursor: pointer; transition: color 150ms; }
.scheme:hover { color: var(--accent); }
[data-theme="night"] .sun, [data-theme="day"] .moon { display: none; }
svg.fig { display: block; width: 100%; height: auto; }


.card { fill: var(--ground-2); stroke: var(--body); stroke-width: 1; }
.card-you { fill: var(--wash); stroke: var(--accent); stroke-width: 1.2; }
.life { stroke: var(--edge); stroke-width: 1; stroke-dasharray: 4 4; }
.hair { stroke: var(--edge); stroke-width: 1; }
.frag { fill: var(--wash-ink); stroke: var(--edge); stroke-width: 1; }
.frag-sep { stroke: var(--edge); stroke-width: 1; stroke-dasharray: 5 4; }
.tab { fill: var(--ground-2); stroke: var(--edge); stroke-width: 1; }
.flow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.flow-you { fill: none; stroke: var(--accent); stroke-width: 1.4; }
.m-muted { fill: var(--muted); }
.m-accent { fill: var(--accent); }
/* a session's mark on the hub's rail, drawn as the hub draws it: a three-quarter ring while it works,
   a sand dot while it waits on a run, a moss dot when it needs you */
.hm-work { fill: none; stroke: var(--accent-2); stroke-width: 2; }
.hm-runs { fill: var(--accent-2); }
.hm-needs { fill: var(--accent); }
.hm-gap { fill: var(--ground); }
svg text { fill: var(--body); font-family: var(--font-body); }
.name { font-weight: 600; font-size: 15px; }
.name-you { font-weight: 600; font-size: 15px; fill: var(--accent); }
.role { font-size: 13px; }
.step { font-size: 14px; }
.note { font-size: 13px; fill: var(--muted); }
.m { font-family: var(--font-mono); font-size: 0.9em; }
.band, .guard, .guard-you, .legend, .state { font-family: var(--font-mono); font-size: 13px; fill: var(--muted); }
.guard-you, .state-you { fill: var(--accent); }
.state-you { font-family: var(--font-mono); font-size: 13px; }

</style>

<p class="lead">As a build lands, the orchestrator sorts its calls and puts to you only those yours to make, each with the artefact that shows it, before you rule.</p>

  <g data-step="1">
    <text class="name" x="176" y="24" text-anchor="middle">worker</text>
    <text class="role" x="176" y="42" text-anchor="middle">one ticket, on any host</text>
    <text class="name" x="560" y="24" text-anchor="middle">orchestrator</text>
    <text class="role" x="560" y="42" text-anchor="middle">holds the branch it merges into</text>
    <text class="name-you" x="1084" y="24" text-anchor="middle">you</text>
    <text class="role" x="1084" y="42" text-anchor="middle">the calls yours to make</text>
  </g>

  <text data-step="2" class="band" x="24" y="96">the build, while you are away</text>
  <text data-step="3" class="state" x="576" y="129">idle on a run</text>
  <text data-step="3" class="note" x="576" y="148"><tspan class="m">dispatch wait</tspan> on each worker, in the background</text>
  <text data-step="2" class="step" x="216" y="129">build it, test it</text>
  <text data-step="2" class="note" x="216" y="150">typecheck and single test files as it goes, then the</text>
  <text data-step="2" class="note" x="216" y="166">full suite and the full-path checks its host can drive</text>
  <text data-step="4" class="step" x="216" y="193"><tspan class="m">/mx:code-review</tspan> of its own branch</text>
  <text data-step="4" class="note" x="216" y="214">light by default; every finding gets a disposition</text>
  <text data-step="5" class="step" x="216" y="241">write the report</text>
  <text data-step="5" class="note" x="216" y="262">what landed, the criteria it meets, its findings and friction;</text>
  <text data-step="5" class="note" x="216" y="278">each assumption anchored to the line it concerns;</text>
  <text data-step="5" class="note" x="216" y="294">its questions: the calls only you can make</text>
  <text data-step="6" class="step" x="216" y="319">commits it last: <tspan class="m">agent/show/&lt;slug&gt;/report.md</tspan></text>

  <text data-step="7" class="band" x="24" y="362">the landing</text>
  <text data-step="7" class="state" x="576" y="385">working</text>
  <text data-step="7" class="step" x="600" y="410"><tspan class="m">dispatch ctl probe</tspan>, then <tspan class="m">dispatch fetch &lt;slug&gt;</tspan></text>
  <text data-step="7" class="note" x="600" y="431"><tspan class="m">report=yes</tspan>: this round committed a report, the worker's finished signal</text>
  <text data-step="7" class="note" x="600" y="447">no report: <tspan class="m">dispatch ctl log</tspan> says how it ended, and the worker is resumed</text>
  <text data-step="8" class="step" x="600" y="474">read the diff against the ticket and its ancestry</text>
  <text data-step="8" class="note" x="600" y="495">tick the criteria it meets; a miss goes back to the worker on resume</text>
  <text data-step="9" class="step" x="600" y="522">file the punts</text>
  <text data-step="9" class="note" x="600" y="543">a punt not fixed now, the review one level up's findings included,</text>
  <text data-step="9" class="note" x="600" y="559">goes on its ticket as a question, or waits for your triage as a proposed ticket</text>
  <text data-step="10" class="step" x="600" y="586"><tspan class="m">dispatch review &lt;slug&gt;</tspan></text>
  <text data-step="10" class="note" x="600" y="607">imports the report into the ticket, renders the review page, writes review</text>
  <text data-step="11" class="step" x="600" y="634">a child ruled with its parent: merged into the parent's branch</text>
  <text data-step="11" class="note" x="600" y="655">on this read, <tspan class="m">--no-ff</tspan> in every repo, then verified; its siblings build on it,</text>
  <text data-step="11" class="note" x="600" y="671">and its calls wait for the parent's close-out</text>
  <text data-step="12" class="step" x="600" y="698">sort the build's calls</text>
  <text data-step="12" class="note" x="600" y="719">each already yours, the agent's, or yours to make;</text>
  <text data-step="12" class="note" x="600" y="735">a hinge, or a ticket off the integration branch, is ruled alone;</text>
  <text data-step="12" class="note" x="600" y="751">at a close-out, the sort runs over the whole tree</text>

  <text data-step="13" class="guard" x="332" y="793">the sort</text>
  <text data-step="13" class="guard" x="332" y="821">nothing yours</text>
  <text data-step="13" class="guard" x="332" y="837">to make</text>
  <text data-step="13" class="step" x="600" y="821">merge <tspan class="m">--no-ff</tspan> and verify, on the yes its merge needs</text>
  <text data-step="13" class="note" x="600" y="842">a hinge: your standing yes; a ticket off the integration branch: your word</text>
  <text data-step="13" class="note" x="600" y="858">green: its open questions ruled "accepted unasked", then done</text>
  <text data-step="13" class="note" x="600" y="874">without that yes, the build waits in review for your word</text>
  <text data-step="13" class="step" x="600" y="901">a fork builds the landing's show</text>
  <text data-step="13" class="note" x="600" y="922">none where the diff makes the change plain at a glance</text>
  <text data-step="13" class="step" x="600" y="947">one line: what landed, the show, the review page</text>
  <text data-step="14" class="guard-you" x="332" y="1005">calls yours</text>
  <text data-step="14" class="guard-you" x="332" y="1021">to make</text>
  <text data-step="14" class="step" x="600" y="1005">each call a <tspan class="m">[Dn]</tspan> question on its ticket</text>
  <text data-step="14" class="note" x="600" y="1026">the choice the build made, the alternative, the line it shaped;</text>
  <text data-step="14" class="note" x="600" y="1042">the board's needs-me group holds it until you rule</text>
  <text data-step="14" class="step" x="600" y="1069">each call on the session page</text>
  <text data-step="14" class="note" x="600" y="1099">with the smallest artefact that shows it, the review page linked</text>
  <text data-step="14" class="step" x="600" y="1126">a fork builds the show around those calls</text>
  <text data-step="14" class="note" x="600" y="1147">once every call of this tick is announced; top down, the code diff last</text>
  <text data-step="14" class="step" x="600" y="1172">the show, beside the review pages</text>
  <text data-step="15" class="state-you" x="576" y="1211">needs you</text>

  <text data-step="16" class="band" x="24" y="1260">the ruling</text>
  <text data-step="16" class="step" x="600" y="1281">your ruling, one of four</text>

<script>
  const root = document.documentElement
  const theme = new URLSearchParams(location.search).get("theme")
  const night = theme ? theme === "night" : matchMedia("(prefers-color-scheme: dark)").matches
  const set = (night) => {
    root.dataset.theme = night ? "night" : "day"
    document.getElementById("scheme").setAttribute("aria-label", night ? "switch to day" : "switch to night")
  }
  document.getElementById("scheme").addEventListener("click", () => set(root.dataset.theme !== "night"))
  set(night)
