<style>
/* tokens.css from /mx:house-style, inlined */
/* The house tokens: parchment over brown ink by day, charcoal and sand by
   night, one moss accent for anything you can act on. Copy this file into the
   project, with the font <link> from the head of demo.html, and change what the
   project needs: the serif, the size and leading that fit it, the measure. The
   colours and the roles stay.

   Every colour but the series is a light-dark() pair. Without data-theme on
   the root the page follows the system; data-theme="day" or "night" pins it.
   The rules sit in the base and components layers, so a project's own CSS,
   and Tailwind's utilities, win over them without fighting specificity. */

:root {
  color-scheme: light dark;

  --ground: light-dark(#f4e4cd, #14110e);
  --ground-2: light-dark(#eddabe, #1b1713);
  --edge: light-dark(#cfbca3, #463f37);
  --muted: light-dark(#5e5650, #b0a89e);
  --body: light-dark(#37261d, #ede3d2);
  --strong: light-dark(#22140b, #faf2dc);
  --accent: light-dark(#426724, #75a252);
  --accent-2: light-dark(#674806, #cdb78a);
  --wash: light-dark(rgb(66 103 36 / 0.16), rgb(117 162 82 / 0.22));
  --wash-ink: color-mix(in srgb, var(--muted) 6%, transparent);
  --mark: light-dark(rgb(168 139 81 / 0.35), rgb(205 183 138 / 0.35));

  /* Flexoki's orange, blue, yellow, purple and green at half their chroma, so
     five series sit quietly on either ground; each clears 3:1 on ground and
     ground-2. The night yellow is darkened to the others' lightness, which it
     outshone. Yellow and green, the closest pair, never sit side by side. */
  --series-1: light-dark(#9c6850, #b88467); /* rust */
  --series-2: light-dark(#446083, #6583a0); /* dusty blue */
  --series-3: light-dark(#806f4b, #9e8856); /* mustard */
  --series-4: light-dark(#594e7b, #8a85aa); /* slate */
  --series-5: light-dark(#6d7b4e, #8b956a); /* sage */

  --font-body: "Newsreader", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --size-body: 19px;
  --leading-body: 1.62;
  --measure: 43rem;
  --page: 62rem;
  --radius: 6px;
}

[data-theme="day"] {
  color-scheme: light;
}

[data-theme="night"] {
  color-scheme: dark;
}

@layer base {
  body {
    margin: 0;
    background: var(--ground);
    color: var(--body);
    font: 400 var(--size-body) / var(--leading-body) var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection {
    background: var(--mark);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* A link in chrome (nav, back, next) is muted text that turns accent; a link
     in running text is accent and underlined, under .prose below. */
  a {
    color: inherit;
    text-decoration: none;
    transition: color 150ms;
  }

  a:hover {
    color: var(--accent);
  }

  code,
  kbd,
  pre {
    font-family: var(--font-mono);
  }

  code {
    font-size: 0.875em;
  }
}

/* Type by role, so a page asks for a heading rather than a size. */
@layer components {
  .v-title {
    font-weight: 600;
    font-size: clamp(1.875rem, 3.5vw, 2.5rem);
    line-height: 1.12;
    letter-spacing: -0.022em;
    color: var(--strong);
  }

  .v-h2 {
    font-weight: 600;
    font-size: 1.3em;
    line-height: 1.3;
    letter-spacing: -0.012em;
    color: var(--strong);
  }

  .v-h3 {
    font-weight: 600;
    font-size: 1.05em;
    line-height: 1.4;
    color: var(--strong);
  }

  .v-lead {
    font-size: 1.14em;
    line-height: 1.55;
  }

  .v-small {
    font-size: 0.92em;
    line-height: 1.6;
  }

  /* The monospace line: dates, counts, provenance, field labels. Lowercase. */
  .v-meta {
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    line-height: 1.5;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .v-num {
    font-family: var(--font-mono);
    font-size: 0.92em;
    font-variant-numeric: tabular-nums;
  }

  /* Running text, styled by tag: prose arrives as markup and should not need
     a class per paragraph. */
  .prose > * {
    max-width: var(--measure);
  }

  /* A table or a code block takes the width of the column the prose sits in
     rather than the measure: squeezed to the measure, its cells wrap. */
  .prose > table,
  .prose > pre {
    max-width: 100%;
  }

  .prose > * + * {
    margin-top: 1.1em;
  }

  .prose h2 {
    font-weight: 600;
    font-size: 1.3em;
    line-height: 1.3;
    letter-spacing: -0.012em;
    color: var(--strong);
    margin-top: 2.4em;
  }

  .prose h3 {
    font-weight: 600;
    font-size: 1.05em;
    color: var(--strong);
    margin-top: 1.8em;
  }

  .prose a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
  }

  .prose a:hover {
    text-decoration-color: var(--accent);
  }

  .prose strong {
    font-weight: 600;
    color: var(--strong);
  }

  .prose code {
    background: var(--ground-2);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }

  .prose ul,
  .prose ol {
    padding-left: 1.2em;
  }

  .prose li + li {
    margin-top: 0.4em;
  }

  .prose li::marker {
    color: var(--muted);
  }

  /* Block display lets a table too wide for a narrow window scroll inside
     itself instead of widening the page. */
  .prose table {
    display: block;
    width: max-content;
    overflow-x: auto;
    border-collapse: collapse;
  }

  .prose th,
  .prose td {
    padding: 0.45rem 1.75rem 0.45rem 0;
    text-align: left;
    vertical-align: baseline;
  }

  .prose th:last-child,
  .prose td:last-child {
    padding-right: 0;
  }

  .prose th {
    font: 400 0.8125rem / 1.5 var(--font-mono);
    color: var(--muted);
    border-bottom: 1px solid var(--muted);
  }

  .prose td {
    border-bottom: 1px solid var(--edge);
  }

  .prose tr:last-child td {
    border-bottom: 0;
  }

  .prose blockquote {
    margin: 0;
    border-left: 2px solid var(--edge);
    padding-left: 1.2em;
    color: var(--muted);
  }
}


/* the figure */
:root{
  --l-main: var(--body);
  --l-fog: var(--series-4);
  --l-rival: var(--series-3);
  --l-session: color-mix(in srgb, var(--muted) 60%, var(--ground));
  --l-tree: var(--series-1);
  --l-loop: var(--series-2);
  --l-proposed: var(--muted);
}
body{padding:40px 40px 32px; position:relative;}
h1{margin:0;}
.sub{font-size:15px; line-height:1.5; color:var(--muted); margin:12px 0 28px; max-width:860px;}
.scheme{position:absolute; top:40px; right:40px; display:inline-flex; padding:4px; border:0; background:none; color:var(--muted); cursor:pointer; transition:color 150ms;}
.scheme:hover{color:var(--accent);}
[data-theme="night"] .sun, [data-theme="day"] .moon{display:none;}
svg.map{display:block; width:100%; height:auto;}
.ln{fill:none; stroke-width:6; stroke-linecap:butt; stroke-linejoin:round;}
.main{stroke:var(--l-main);} .fog{stroke:var(--l-fog);} .rival{stroke:var(--l-rival);}
.session{stroke:var(--l-session);} .tree{stroke:var(--l-tree);} .loop{stroke:var(--l-loop);}
.proposed{stroke:var(--l-proposed); stroke-dasharray:10 6;}
.tick{stroke-width:4; stroke-linecap:butt;}
.xchg{fill:var(--ground); stroke:var(--body); stroke-width:2;}
.you{fill:var(--accent); stroke:var(--ground); stroke-width:3;}
.ring{fill:var(--ground); stroke:var(--accent); stroke-width:3;}
.num{font:500 12px var(--font-mono); fill:var(--ground); text-anchor:middle;}
.num-ring{font:500 12px var(--font-mono); fill:var(--accent); text-anchor:middle;}
.name{font:600 14px var(--font-body); fill:var(--body);}
.name-you{font:600 14px var(--font-body); fill:var(--accent);}
.role{font:400 13px var(--font-body); fill:var(--muted);}
.tag{font:400 13px var(--font-mono); fill:var(--muted);}
.detail{font:400 12px var(--font-mono); fill:var(--muted);}
.zone{fill:var(--wash-ink); stroke:var(--edge); stroke-width:1;}
.hair{stroke:var(--edge); stroke-width:1;}
.mid{text-anchor:middle;} .end{text-anchor:end;}
.kdot{fill:var(--accent);}
.kring{fill:var(--ground); stroke:var(--accent); stroke-width:3;}
.kname{font:600 15px var(--font-body); fill:var(--body);}
.kdesc{font:400 14px var(--font-body); fill:var(--muted);}
</style>

<h1 class="v-title">The mx workflow as one map</h1>
<p class="sub">Every piece of work rides one line from an intent to merged and leaves it only where its route has a step of its own; what a landing turns up comes back as new work, and the numbered stops are the only places the workflow asks for you.</p>

  <text class="tag" x="348" y="780">a step an agent runs</text>

    <text class="kdesc"><tspan x="284" y="876">pick among the rival shapes in</tspan><tspan x="284" dy="20">front of their renders; the</tspan><tspan x="284" dy="20">verdict goes into the ticket</tspan></text>
  </g>
  <g data-step="5">
    <circle class="kdot" cx="508" cy="856" r="11"/><text class="num" x="508" y="860">3</text>

    <text class="kdesc"><tspan x="532" y="876">read the session's diff, linked</tspan><tspan x="532" dy="20">from its page; it merges on</tspan><tspan x="532" dy="20">your word</tspan></text>

  <g data-step="7">

    <text class="kdesc"><tspan x="284" y="1016">drive what landed on your own</tspan><tspan x="284" dy="20">machine while the rest of the</tspan><tspan x="284" dy="20">frontier keeps running; what</tspan><tspan x="284" dy="20">you find is filed open</tspan></text>

  </g>
</svg>

<script>
const root = document.documentElement
const theme = new URLSearchParams(location.search).get("theme")
const dark = theme ? theme === "night" : matchMedia("(prefers-color-scheme: dark)").matches
const button = document.getElementById("scheme")
const set = (night) => {
  root.dataset.theme = night ? "night" : "day"
  button.setAttribute("aria-label", night ? "switch to day" : "switch to night")
}
button.addEventListener("click", () => set(root.dataset.theme !== "night"))
set(dark)
</script>
</body>
