<style>
/* The house tokens: parchment over brown ink by day, charcoal and sand by
   night, one moss accent for anything you can act on. Copy this file into the
   project, with the font <link> from the head of demo.html, and change what the
   project needs: the serif, the size and leading that fit it, the measure. The
   colours and the roles stay.

   Every colour but the series is a light-dark() pair. Without data-theme on
   the root the page follows the system; data-theme="day" or "night" pins it.
   The rules sit in the base and components layers, so a project's own CSS,
   and Tailwind's utilities, win over them without fighting specificity. */

:root {
  color-scheme: light dark;

  --ground: light-dark(#f4e4cd, #1a1714);
  --ground-2: light-dark(#eddabe, #201c18);
  --edge: light-dark(#cfbca3, #4a433b);
  --muted: light-dark(#5e5650, #b0a89e);
  --body: light-dark(#37261d, #ede3d2);
  --strong: light-dark(#22140b, #faf2dc);
  --accent: light-dark(#426724, #75a252);
  --accent-2: light-dark(#674806, #cdb78a);
  --wash: light-dark(rgb(66 103 36 / 0.16), rgb(117 162 82 / 0.22));
  --wash-ink: color-mix(in srgb, var(--muted) 6%, transparent);
  --mark: light-dark(rgb(168 139 81 / 0.35), rgb(205 183 138 / 0.35));

  /* Muted on purpose, so five series sit quietly on either ground. The order
     keeps the two closest pairs, dusty blue and slate, sage and mustard, from
     ever sitting side by side. */
  --series-1: #9c6b50; /* rust */
  --series-2: #5e7a9b; /* dusty blue */
  --series-3: #b8915a; /* mustard */
  --series-4: #6e6479; /* slate */
  --series-5: #7c8f6f; /* sage */

  --font-body: "Newsreader", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --size-body: 19px;
  --leading-body: 1.62;
  --measure: 43rem;
  --page: 62rem;
  --radius: 6px;
}

[data-theme="day"] {
  color-scheme: light;
}

[data-theme="night"] {
  color-scheme: dark;
}

@layer base {
  body {
    margin: 0;
    background: var(--ground);
    color: var(--body);
    font: 400 var(--size-body) / var(--leading-body) var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection {
    background: var(--mark);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* A link in chrome (nav, back, next) is muted text that turns accent; a link
     in running text is accent and underlined, under .prose below. */
  a {
    color: inherit;
    text-decoration: none;
    transition: color 150ms;
  }

  a:hover {
    color: var(--accent);
  }

  code,
  kbd,
  pre {
    font-family: var(--font-mono);
  }

  code {
    font-size: 0.875em;
  }
}

/* Type by role, so a page asks for a heading rather than a size. */
@layer components {
  .v-title {
    font-weight: 600;
    font-size: clamp(1.875rem, 3.5vw, 2.5rem);
    line-height: 1.12;
    letter-spacing: -0.022em;
    color: var(--strong);
  }

  .v-h2 {
    font-weight: 600;
    font-size: 1.3em;
    line-height: 1.3;
    letter-spacing: -0.012em;
    color: var(--strong);
  }

  .v-h3 {
    font-weight: 600;
    font-size: 1.05em;
    line-height: 1.4;
    color: var(--strong);
  }

  .v-lead {
    font-size: 1.14em;
    line-height: 1.55;
  }

  .v-small {
    font-size: 0.92em;
    line-height: 1.6;
  }

  /* The monospace line: dates, counts, provenance, field labels. Lowercase. */
  .v-meta {
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    line-height: 1.5;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .v-num {
    font-family: var(--font-mono);
    font-size: 0.92em;
    font-variant-numeric: tabular-nums;
  }

  /* Running text, styled by tag: prose arrives as markup and should not need
     a class per paragraph. */
  .prose > * {
    max-width: var(--measure);
  }

  /* A table or a code block takes the width of the column the prose sits in
     rather than the measure: squeezed to the measure, its cells wrap. */
  .prose > table,
  .prose > pre {
    max-width: 100%;
  }

  .prose > * + * {
    margin-top: 1.1em;
  }

  .prose h2 {
    font-weight: 600;
    font-size: 1.3em;
    line-height: 1.3;
    letter-spacing: -0.012em;
    color: var(--strong);
    margin-top: 2.4em;
  }

  .prose h3 {
    font-weight: 600;
    font-size: 1.05em;
    color: var(--strong);
    margin-top: 1.8em;
  }

  .prose a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
  }

  .prose a:hover {
    text-decoration-color: var(--accent);
  }

  .prose strong {
    font-weight: 600;
    color: var(--strong);
  }

  .prose code {
    background: var(--ground-2);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }

  .prose ul,
  .prose ol {
    padding-left: 1.2em;
  }

  .prose li + li {
    margin-top: 0.4em;
  }

  .prose li::marker {
    color: var(--muted);
  }

  /* Block display lets a table too wide for a narrow window scroll inside
     itself instead of widening the page. */
  .prose table {
    display: block;
    width: max-content;
    overflow-x: auto;
    border-collapse: collapse;
  }

  .prose th,
  .prose td {
    padding: 0.45rem 1.75rem 0.45rem 0;
    text-align: left;
    vertical-align: baseline;
  }

  .prose th:last-child,
  .prose td:last-child {
    padding-right: 0;
  }

  .prose th {
    font: 400 0.8125rem / 1.5 var(--font-mono);
    color: var(--muted);
    border-bottom: 1px solid var(--muted);
  }

  .prose td {
    border-bottom: 1px solid var(--edge);
  }

  .prose tr:last-child td {
    border-bottom: 0;
  }

  .prose blockquote {
    margin: 0;
    border-left: 2px solid var(--edge);
    padding-left: 1.2em;
    color: var(--muted);
  }
}


/* The figure on the house tokens above. */
body { padding: 40px 56px 32px; }
header { display: flex; align-items: flex-start; gap: 2rem; }
h1 { margin: 0; }
.lead { margin: 12px 0 28px; max-width: 46rem; font-size: 15px; line-height: 1.5; color: var(--muted); }
.lead code { font-size: 13px; }
.scheme { margin-left: auto; display: inline-flex; padding: 0.25rem; border: 0; background: none; color: var(--muted); cursor: pointer; transition: color 150ms; }
.scheme:hover { color: var(--accent); }
[data-theme="night"] .sun, [data-theme="day"] .moon { display: none; }
svg.fig { display: block; width: 100%; height: auto; }


.lane { fill: none; stroke: var(--edge); stroke-width: 1; }
.lane-fill { fill: var(--wash-ink); stroke: var(--edge); stroke-width: 1; }
.hair { stroke: var(--edge); stroke-width: 1; }
.station { fill: var(--ground-2); stroke: var(--body); stroke-width: 1; }
.station-you { fill: var(--wash); stroke: var(--accent); stroke-width: 1.2; }
.card-you { fill: var(--wash); stroke: var(--accent); stroke-width: 1; }
.ghost, .chip-ghost { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.chip { fill: var(--ground-2); stroke: var(--body); stroke-width: 1; }
.rail { fill: none; stroke: var(--body); stroke-width: 1.2; }
.rail-by { fill: none; stroke: var(--body); stroke-width: 1; }
.out { fill: none; stroke: var(--muted); stroke-width: 1; }
.back { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 5 4; }
.flow { fill: none; stroke: var(--muted); stroke-width: 1; }
.tick { fill: none; stroke: var(--muted); stroke-width: 1; }
.tick-you { fill: none; stroke: var(--accent); stroke-width: 1.2; }
.dot { fill: var(--muted); }
.m-muted { fill: var(--muted); }
.m-body { fill: var(--body); }
.m-accent { fill: var(--accent); }
svg text { fill: var(--body); font-family: var(--font-body); }
.row, .track, .legend, .host { font-family: var(--font-mono); font-size: 13px; fill: var(--muted); }
.track { font-size: 12px; }
.host { font-size: 12px; }
.rowdetail { font-size: 13px; fill: var(--muted); }
.name { font-weight: 600; font-size: 14px; }
.name-you { font-weight: 600; font-size: 14px; fill: var(--accent); }
.note, .sdetail { font-size: 13px; fill: var(--muted); }
.chiptext { font-size: 13px; fill: var(--body); }
.cmdline { font-family: var(--font-mono); font-size: 12px; }
.state { font-family: var(--font-mono); font-size: 14px; font-weight: 500; }
.gstate { font-family: var(--font-mono); font-size: 13px; fill: var(--muted); }
.m { font-family: var(--font-mono); font-size: 12px; }

</style>

  <text class="note" x="224" y="736">serial worker</text>
  <text class="cmdline" x="224" y="766"><tspan class="m">worker-hosts</tspan></text>
  <text class="note" x="224" y="784">the hosts to pick from, one</text>
  <text class="note" x="224" y="800">per ticket as it spawns</text>
  <text class="cmdline" x="504" y="572"><tspan class="m">dispatch claim &lt;slug&gt;</tspan></text>
  <text class="cmdline" x="504" y="592"><tspan class="m">dispatch prompt &lt;slug&gt; &lt; msg</tspan></text>
  <text class="cmdline" x="504" y="612"><tspan class="m">dispatch ctl --host &lt;host&gt;</tspan></text>
  <text class="cmdline" x="520" y="628"><tspan class="m">spawn &lt;slug&gt; &lt;model&gt;</tspan></text>
  <text class="cmdline" x="504" y="648"><tspan class="m">dispatch wait &lt;slug&gt;</tspan></text>
  <text class="note" x="504" y="668">the ticket and its ancestry</text>
  <text class="note" x="504" y="684">are the worker's whole brief</text>
  <text class="cmdline" x="788" y="572"><tspan class="m">dispatch ctl probe</tspan></text>
  <text class="cmdline" x="788" y="592"><tspan class="m">dispatch fetch &lt;slug&gt;</tspan></text>
  <text class="cmdline" x="788" y="612"><tspan class="m">dispatch review &lt;slug&gt;</tspan></text>
  <text class="note" x="788" y="630">imports the report, renders the</text>
  <text class="note" x="788" y="646">review page, writes review; a child</text>
  <text class="note" x="788" y="662">that is no hinge then merges on this</text>
  <text class="note" x="788" y="678">read into its parent's branch</text>
  <text class="note" x="788" y="706">a parent, at its close-out:</text>
  <text class="cmdline" x="788" y="726"><tspan class="m">tracker set &lt;slug&gt; status=review</tspan></text>
  <text class="cmdline" x="1020" y="572"><tspan class="m">dispatch review &lt;slug&gt;</tspan></text>
  <text class="note" x="1020" y="590">once your accept is</text>
  <text class="note" x="1020" y="606">merged and verified;</text>
  <text class="note" x="1020" y="622">a parent and its children:</text>
  <text class="cmdline" x="1020" y="644"><tspan class="m">dispatch accept &lt;slug&gt;</tspan></text>
  <text class="note" x="1020" y="664">then <tspan class="m">tracker retire</tspan> takes</text>
  <text class="note" x="1020" y="680">a finished tree out</text>
  <text class="name" x="24" y="880">a worker per ticket</text>
  <text class="note" x="24" y="898"><tspan class="m">worker-hosts</tspan> lists the machines, their live state and</text>
  <text class="note" x="24" y="914">what each can do; the orchestrator picks one per ticket</text>
  <text class="note" x="24" y="930">as it spawns it, <tspan class="m">local</tspan> being your own machine. On an</text>
  <text class="note" x="24" y="946">isolated host the worker runs with permissions bypassed.</text>
  <text class="note" x="24" y="962">A worker writes no ticket file: <tspan class="m">dispatch review</tspan> imports</text>
  <text class="note" x="24" y="978">the report it commits.</text>
  <text class="host" x="508" y="854">ticket/a on &lt;user@host&gt;</text>
  <text class="chiptext" x="554" y="881" text-anchor="middle">build, test</text>
  <text class="host" x="508" y="918">ticket/b on &lt;user@host&gt;</text>
  <text class="chiptext" x="554" y="945" text-anchor="middle">build, test</text>
  <text class="host" x="508" y="982">ticket/c on local</text>
  <text class="chiptext" x="554" y="1009" text-anchor="middle">build, test</text>
  <text class="chiptext" x="684.0" y="881" text-anchor="middle"><tspan class="m">/mx:code-review</tspan></text>
  <text class="chiptext" x="824.0" y="881" text-anchor="middle">its report, last</text>
  <text class="chiptext" x="684" y="945" text-anchor="middle">stopped, blocked</text>
  <text class="cmdline" x="768" y="936"><tspan class="m">dispatch ctl resume</tspan></text>
  <text class="note" x="768" y="954">on guidance, or <tspan class="m">continue</tspan>, after an amend, a cleared</text>
  <text class="note" x="768" y="970">blocker or a branch that moved; the status stays claimed</text>
  <text class="chiptext" x="684" y="1009" text-anchor="middle">gone</text>
  <text class="note" x="768" y="1000">the probe says gone: <tspan class="m">dispatch ctl cleanup &lt;slug&gt;</tspan>,</text>
  <text class="note" x="768" y="1016">and the ticket goes back to open for a fresh worker</text>
  <text class="note" x="24" y="996">A resume continues the worker's own conversation on the same</text>
  <text class="note" x="24" y="1012">branches. Writing done retires the run; on a redo, a reject or a</text>
  <text class="note" x="24" y="1028">lost session, <tspan class="m">dispatch ctl cleanup</tspan> removes its worktrees and branches.</text>

<script>
  const root = document.documentElement
  const theme = new URLSearchParams(location.search).get("theme")
  const night = theme ? theme === "night" : matchMedia("(prefers-color-scheme: dark)").matches
  const set = (night) => {
    root.dataset.theme = night ? "night" : "day"
    document.getElementById("scheme").setAttribute("aria-label", night ? "switch to day" : "switch to night")
  }
  document.getElementById("scheme").addEventListener("click", () => set(root.dataset.theme !== "night"))
  set(night)
</script>
