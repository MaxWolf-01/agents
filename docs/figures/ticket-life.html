<style>
/* The house tokens: parchment over brown ink by day, charcoal and sand by
   night, one moss accent for anything you can act on. Copy this file into the
   project, with the font <link> from the head of demo.html, and change what the
   project needs: the serif, the size and leading that fit it, the measure. The
   colours and the roles stay.

   Every colour but the series is a light-dark() pair. Without data-theme on
   the root the page follows the system; data-theme="day" or "night" pins it.
   The rules sit in the base and components layers, so a project's own CSS,
   and Tailwind's utilities, win over them without fighting specificity. */

:root {
  color-scheme: light dark;

  --ground: light-dark(#f4e4cd, #14110e);
  --ground-2: light-dark(#eddabe, #1b1713);
  --edge: light-dark(#cfbca3, #463f37);
  --muted: light-dark(#5e5650, #b0a89e);
  --body: light-dark(#37261d, #ede3d2);
  --strong: light-dark(#22140b, #faf2dc);
  --accent: light-dark(#426724, #75a252);
  --accent-2: light-dark(#674806, #cdb78a);
  --wash: light-dark(rgb(66 103 36 / 0.16), rgb(117 162 82 / 0.22));
  --wash-ink: color-mix(in srgb, var(--muted) 6%, transparent);
  --mark: light-dark(rgb(168 139 81 / 0.35), rgb(205 183 138 / 0.35));

  /* Flexoki's orange, blue, yellow, purple and green at half their chroma, so
     five series sit quietly on either ground; each clears 3:1 on ground and
     ground-2. The night yellow is darkened to the others' lightness, which it
     outshone. Yellow and green, the closest pair, never sit side by side. */
  --series-1: light-dark(#9c6850, #b88467); /* rust */
  --series-2: light-dark(#446083, #6583a0); /* dusty blue */
  --series-3: light-dark(#806f4b, #9e8856); /* mustard */
  --series-4: light-dark(#594e7b, #8a85aa); /* slate */
  --series-5: light-dark(#6d7b4e, #8b956a); /* sage */

  --font-body: "Newsreader", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --size-body: 19px;
  --leading-body: 1.62;
  --measure: 43rem;
  --page: 62rem;
  --radius: 6px;
}

[data-theme="day"] {
  color-scheme: light;
}

[data-theme="night"] {
  color-scheme: dark;
}

@layer base {
  body {
    margin: 0;
    background: var(--ground);
    color: var(--body);
    font: 400 var(--size-body) / var(--leading-body) var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection {
    background: var(--mark);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* A link in chrome (nav, back, next) is muted text that turns accent; a link
     in running text is accent and underlined, under .prose below. */
  a {
    color: inherit;
    text-decoration: none;
    transition: color 150ms;
  }

  a:hover {
    color: var(--accent);
  }

  code,
  kbd,
  pre {
    font-family: var(--font-mono);
  }

  code {
    font-size: 0.875em;
  }
}

/* Type by role, so a page asks for a heading rather than a size. */
@layer components {
  .v-title {
    font-weight: 600;
    font-size: clamp(1.875rem, 3.5vw, 2.5rem);
    line-height: 1.12;
    letter-spacing: -0.022em;
    color: var(--strong);
  }

  .v-h2 {
    font-weight: 600;
    font-size: 1.3em;
    line-height: 1.3;
    letter-spacing: -0.012em;
    color: var(--strong);
  }

  .v-h3 {
    font-weight: 600;
    font-size: 1.05em;
    line-height: 1.4;
    color: var(--strong);
  }

  .v-lead {
    font-size: 1.14em;
    line-height: 1.55;
  }

  .v-small {
    font-size: 0.92em;
    line-height: 1.6;
  }

  /* The monospace line: dates, counts, provenance, field labels. Lowercase. */
  .v-meta {
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    line-height: 1.5;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .v-num {
    font-family: var(--font-mono);
    font-size: 0.92em;
    font-variant-numeric: tabular-nums;
  }

  /* Running text, styled by tag: prose arrives as markup and should not need
     a class per paragraph. */
  .prose > * {
    max-width: var(--measure);
  }

  /* A table or a code block takes the width of the column the prose sits in
     rather than the measure: squeezed to the measure, its cells wrap. */
  .prose > table,
  .prose > pre {
    max-width: 100%;
  }

  .prose > * + * {
    margin-top: 1.1em;
  }

  .prose h2 {
    font-weight: 600;
    font-size: 1.3em;
    line-height: 1.3;
    letter-spacing: -0.012em;
    color: var(--strong);
    margin-top: 2.4em;
  }

  .prose h3 {
    font-weight: 600;
    font-size: 1.05em;
    color: var(--strong);
    margin-top: 1.8em;
  }

  .prose a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
  }

  .prose a:hover {
    text-decoration-color: var(--accent);
  }

  .prose strong {
    font-weight: 600;
    color: var(--strong);
  }

  .prose code {
    background: var(--ground-2);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }

  .prose ul,
  .prose ol {
    padding-left: 1.2em;
  }

  .prose li + li {
    margin-top: 0.4em;
  }

  .prose li::marker {
    color: var(--muted);
  }

  /* Block display lets a table too wide for a narrow window scroll inside
     itself instead of widening the page. */
  .prose table {
    display: block;
    width: max-content;
    overflow-x: auto;
    border-collapse: collapse;
  }

  .prose th,
  .prose td {
    padding: 0.45rem 1.75rem 0.45rem 0;
    text-align: left;
    vertical-align: baseline;
  }

  .prose th:last-child,
  .prose td:last-child {
    padding-right: 0;
  }

  .prose th {
    font: 400 0.8125rem / 1.5 var(--font-mono);
    color: var(--muted);
    border-bottom: 1px solid var(--muted);
  }

  .prose td {
    border-bottom: 1px solid var(--edge);
  }

  .prose tr:last-child td {
    border-bottom: 0;
  }

  .prose blockquote {
    margin: 0;
    border-left: 2px solid var(--edge);
    padding-left: 1.2em;
    color: var(--muted);
  }
}



/* The figure on the house tokens above. */
body { padding: 40px 56px 32px; }
header { display: flex; align-items: flex-start; gap: 2rem; }
h1 { margin: 0; }
.lead { margin: 12px 0 28px; max-width: 46rem; font-size: 15px; line-height: 1.5; color: var(--muted); }
.scheme { margin-left: auto; display: inline-flex; padding: 0.25rem; border: 0; background: none; color: var(--muted); cursor: pointer; transition: color 150ms; }
.scheme:hover { color: var(--accent); }
[data-theme="night"] .sun, [data-theme="day"] .moon { display: none; }
svg.fig { display: block; width: 100%; height: auto; }

.lane { fill: none; stroke: var(--edge); stroke-width: 1; }
.lane-fill { fill: var(--wash-ink); stroke: var(--edge); stroke-width: 1; }
.hair { stroke: var(--edge); stroke-width: 1; }
.mask { fill: var(--ground); }
.card-you { fill: var(--wash); stroke: var(--accent); stroke-width: 1.2; }
.gone { fill: none; stroke: var(--muted); stroke-width: 1; }
.chip { fill: var(--ground-2); stroke: var(--body); stroke-width: 1; }
.chip-ghost { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.rail { fill: none; stroke: var(--body); stroke-width: 1.2; }
.back { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 5 4; }
.out { fill: none; stroke: var(--muted); stroke-width: 1; }
.flow { fill: none; stroke: var(--muted); stroke-width: 1; }
.tick { fill: none; stroke: var(--muted); stroke-width: 1; }
.you { fill: none; stroke: var(--accent); stroke-width: 1.2; }
.dot { fill: var(--muted); }
.m-muted { fill: var(--muted); }
.m-body { fill: var(--body); }
.m-accent { fill: var(--accent); }

/* a status as the board's dependency graph draws it: board.GRAPH_INK, the fill, the stroke, the
   text, and the dash where it has one; the glyph before the name is board.STATUS_SYMBOL */
.b-proposed { fill: var(--ground); stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.b-open { fill: var(--ground-2); stroke: var(--body); stroke-width: 1; }
.b-blocked { fill: var(--ground); stroke: var(--edge); stroke-width: 1; }
.b-claimed { fill: var(--ground-2); stroke: var(--muted); stroke-width: 1; }
.b-review { fill: var(--wash); stroke: var(--accent); stroke-width: 1; }
.b-done { fill: var(--ground); stroke: var(--edge); stroke-width: 1; stroke-dasharray: 2 3; }
svg .ink-body { fill: var(--body); }
svg .ink-muted { fill: var(--muted); }
svg .ink-strong { fill: var(--strong); }

svg text { fill: var(--body); font-family: var(--font-body); }
.row, .legend { font-family: var(--font-mono); font-size: 13px; fill: var(--muted); }
.rowdetail { font-size: 13px; fill: var(--muted); }
.host { font-family: var(--font-mono); font-size: 12px; fill: var(--muted); }
.track { font-size: 12px; fill: var(--muted); }
.name { font-weight: 600; font-size: 14px; }
.name-you { font-weight: 600; font-size: 14px; fill: var(--accent); }
.note { font-size: 13px; fill: var(--muted); }
.chiptext { font-size: 13px; fill: var(--body); }
.cmdline { font-family: var(--font-mono); font-size: 12px; }
.state { font-family: var(--font-mono); font-size: 14px; font-weight: 500; }
.keymark { font-family: var(--font-mono); font-size: 12px; }
.gstate { font-family: var(--font-mono); font-size: 13px; fill: var(--muted); }
.m { font-family: var(--font-mono); font-size: 12px; }
</style>

    <text class="track" x="933" y="494" text-anchor="middle" data-step="5">accept</text>
  </g>
  <!-- labels: the key -->
  <g>
    <text class="row" x="940" y="292" data-step="6">on the board</text>
    <text class="keymark ink-body" x="948" y="319" data-step="6">◌ proposed</text>
    <text class="keymark ink-body" x="948" y="343" data-step="6">○ open</text>
    <text class="keymark ink-muted" x="948" y="367" data-step="6">⊘ blocked</text>
    <text class="keymark ink-body" x="948" y="391" data-step="6">⟳ claimed</text>
    <text class="keymark ink-strong" x="948" y="415" data-step="6">◉ review</text>
    <text class="keymark ink-muted" x="948" y="439" data-step="6">✓ done</text>
    <text class="note" x="1048" y="320" data-step="6">not ruled on</text>
    <text class="note" x="1048" y="344" data-step="6">ruled, unblocked</text>
    <text class="note" x="1048" y="368" data-step="6">open, a blocker holds it</text>
    <text class="note" x="1048" y="392" data-step="6">a session holds it</text>
    <text class="note" x="1048" y="416" data-step="6">waits for your ruling</text>
    <text class="note" x="1048" y="440" data-step="6">a blocker, as context</text>
  </g>
  <!-- labels: the tracks back -->
  <g>
    <text class="track" x="608" y="352" text-anchor="middle" data-step="21">redo</text>
    <text class="track" x="608" y="368" text-anchor="middle" data-step="21"><tspan class="m">tracker set &lt;slug&gt; status=open</tspan></text>
    <text class="track" x="470" y="400" text-anchor="middle" data-step="22">session lost</text>
    <text class="track" x="470" y="416" text-anchor="middle" data-step="22"><tspan class="m">tracker set &lt;slug&gt; status=open</tspan></text>
    <text class="track" x="728" y="400" text-anchor="middle" data-step="19">amend</text>
    <text class="track" x="728" y="416" text-anchor="middle" data-step="19"><tspan class="m">dispatch ctl resume &lt;slug&gt; &lt;model&gt;</tspan></text>
  </g>
  <!-- labels: out of the live tracker -->
  <g>
    <text class="track" x="192" y="552" data-step="11">dropped or merged at a triage</text>
    <text class="note" x="548" y="596" data-step="11">gone from the live tracker, the</text>
    <text class="note" x="548" y="612" data-step="11">file stays in git, with the reason</text>
    <text class="note" x="548" y="628" data-step="11">in the commit that took it out</text>
    <text class="gstate" x="280" y="628" data-step="11">dropped</text>
    <text class="cmdline ink-muted" x="280" y="648" data-step="11">tracker drop &lt;slug&gt;</text>
  </g>
  <g>
    <text class="track" x="748" y="552" text-anchor="end" data-step="23">reject</text>
    <text class="gstate" x="1052" y="624" data-step="25">retired</text>
    <text class="cmdline ink-muted" x="1052" y="644" data-step="25">tracker retire</text>
  </g>

  <!-- labels: with you -->
  <g>
    <text class="name-you" x="40" y="68" data-step="10">your triage</text>
    <text class="note" x="40" y="86" data-step="10"><tspan class="m">/mx:triage</tspan>, which you start, groups</text>
    <text class="note" x="40" y="102" data-step="10">every proposed ticket by shared cause;</text>
    <text class="note" x="40" y="118" data-step="10">the agent drops, merges or promotes</text>
    <text class="note" x="40" y="134" data-step="10">each, asking you only design calls.</text>
    <text class="note" x="40" y="150" data-step="10">Your word promotes one at once</text>
    <text class="cmdline" x="40" y="180" data-step="10">tracker set &lt;slug&gt; status=open</text>
    <text class="name" x="320" y="68" data-step="7">ask for a ticket</text>
    <text class="note" x="320" y="86" data-step="7">you ask for it ("build this"), or file what you found</text>
    <text class="note" x="320" y="102" data-step="7">driving what landed. Your asking is its ruling, so it</text>
    <text class="note" x="320" y="118" data-step="7">is filed open. A reopened decision is a new ticket that</text>
    <text class="note" x="320" y="134" data-step="7">supersedes the old one, since nothing moves back from done</text>
    <text class="cmdline" x="320" y="158" data-step="7">tracker new &lt;slug&gt; --status open</text>
    <text class="name" x="344" y="186" data-step="8">a cut into slices</text>
    <text class="note" x="344" y="204" data-step="8">the agent files each slice open, since the cut is its</text>
    <text class="note" x="344" y="220" data-step="8">call and a slice is ruled by what it builds</text>
    <text class="cmdline" x="344" y="242" data-step="8">tracker new &lt;slug&gt; --parent &lt;p&gt; --status open</text>
  </g>
  <g>
    <text class="name-you" x="756" y="68" data-step="17">your ruling</text>
    <text class="note" x="756" y="86" data-step="17">accept, amend, redo or reject,</text>
    <text class="note" x="756" y="102" data-step="17">on the calls the landing shows</text>
    <text class="note" x="756" y="118" data-step="17">you, each a <tspan class="m">[Dn]</tspan> question. A</text>
    <text class="note" x="756" y="134" data-step="17">build with no call of yours</text>
    <text class="note" x="756" y="150" data-step="17">merges into its parent's branch</text>
    <text class="note" x="756" y="166" data-step="17">on your standing yes; a child</text>
    <text class="note" x="756" y="182" data-step="17">is ruled with its parent</text>
    <text class="name" x="1004" y="68" data-step="18">your answer</text>
    <text class="note" x="1004" y="86" data-step="18">a ticket's question waits in</text>
    <text class="note" x="1004" y="102" data-step="18">the board's needs-me group.</text>
    <text class="note" x="1004" y="118" data-step="18">Dispatch keeps a needs-user</text>
    <text class="note" x="1004" y="134" data-step="18">ticket from every worker, for</text>
    <text class="note" x="1004" y="150" data-step="18">a session with you. An answer</text>
    <text class="note" x="1004" y="166" data-step="18">given mid-build reaches the</text>
    <text class="note" x="1004" y="182" data-step="18">worker when it resumes</text>
  </g>

  <!-- labels: the orchestrator -->
  <g>
    <text class="cmdline" x="24" y="744" data-step="9">tracker new &lt;slug&gt;</text>
    <text class="note" x="24" y="764" data-step="9">files what it reads on its own:</text>
    <text class="note" x="24" y="780" data-step="9">a punt or friction in a worker's</text>
    <text class="note" x="24" y="796" data-step="9">report, a finding of the review</text>
    <text class="note" x="24" y="812" data-step="9">one level up. Any session's</text>
    <text class="note" x="24" y="828" data-step="9">agent files the same way</text>
  </g>
  <g>
    <text class="cmdline" x="252" y="744" data-step="12">tracker frontier</text>
    <text class="note" x="252" y="764" data-step="12">each tick: the open tickets nobody holds,</text>
    <text class="note" x="252" y="780" data-step="12">unblocked and not needing you; a</text>
    <text class="note" x="252" y="796" data-step="12">proposed one waits for a triage. A</text>
    <text class="note" x="252" y="812" data-step="12">sibling in review and merged into</text>
    <text class="note" x="252" y="828" data-step="12">the parent's branch no longer blocks</text>
    <text class="name" x="252" y="860" data-step="13">plan the wave</text>
    <text class="note" x="252" y="878" data-step="13">disjoint files run together; a shared</text>
    <text class="note" x="252" y="894" data-step="13">surface goes to one serial worker</text>
    <text class="cmdline" x="252" y="922" data-step="13">worker-hosts</text>
    <text class="note" x="252" y="940" data-step="13">the hosts to pick from, one per ticket</text>
    <text class="note" x="252" y="956" data-step="13">as it spawns</text>
    <text class="cmdline" x="532" y="744" data-step="14">dispatch claim &lt;slug&gt;</text>
    <text class="cmdline" x="532" y="764" data-step="14">dispatch prompt &lt;slug&gt; &lt; msg</text>
    <text class="cmdline" x="532" y="784" data-step="14">dispatch ctl --host &lt;host&gt;</text>
    <text class="cmdline" x="548" y="800" data-step="14">spawn &lt;slug&gt; &lt;model&gt;</text>
    <text class="cmdline" x="532" y="820" data-step="14">dispatch wait &lt;slug&gt;</text>
    <text class="note" x="532" y="840" data-step="14">the ticket and its ancestry are</text>
    <text class="note" x="532" y="856" data-step="14">everything the worker is told</text>
  </g>
  <g>
    <text class="cmdline" x="800" y="744" data-step="16">dispatch ctl probe</text>
    <text class="cmdline" x="800" y="764" data-step="16">dispatch fetch &lt;slug&gt;</text>
    <text class="cmdline" x="800" y="784" data-step="16">dispatch review &lt;slug&gt;</text>
    <text class="note" x="800" y="802" data-step="16">imports the report, renders</text>
    <text class="note" x="800" y="818" data-step="16">the review page, and writes</text>
    <text class="note" x="800" y="834" data-step="16">review; a child then merges</text>
    <text class="note" x="800" y="850" data-step="16">on this read into its</text>
    <text class="note" x="800" y="866" data-step="16">parent's branch</text>
    <text class="note" x="800" y="892" data-step="16">a parent, at its close-out:</text>
    <text class="cmdline" x="800" y="912" data-step="16">tracker set &lt;slug&gt; status=review</text>
    <text class="cmdline" x="800" y="940" data-step="18">tracker rule &lt;slug&gt; D&lt;n&gt; "&lt;answer&gt;"</text>
    <text class="note" x="800" y="958" data-step="18">records each answer you give</text>
  </g>
  <g>
    <text class="cmdline" x="1004" y="744" data-step="24">dispatch review &lt;slug&gt;</text>
    <text class="note" x="1004" y="762" data-step="24">once your accept is merged</text>
    <text class="note" x="1004" y="778" data-step="24">and verified; a parent and</text>
    <text class="note" x="1004" y="794" data-step="24">its children:</text>
    <text class="cmdline" x="1004" y="820" data-step="24">dispatch accept &lt;slug&gt;</text>
    <text class="note" x="1004" y="838" data-step="24">each then runs</text>
    <text class="note" x="1004" y="854" data-step="24"><tspan class="m">tracker retire</tspan>: a finished</text>
    <text class="note" x="1004" y="870" data-step="24">tree leaves the live tracker</text>
  </g>

  <!-- labels: worker hosts -->
  <g>
    <text class="name" x="24" y="1052" data-step="15">a worker per ticket</text>
    <text class="note" x="24" y="1070" data-step="15"><tspan class="m">worker-hosts</tspan> lists the machines, their live state and what</text>
    <text class="note" x="24" y="1086" data-step="15">each can do; the orchestrator picks one per ticket as it</text>
    <text class="note" x="24" y="1102" data-step="15">spawns it, <tspan class="m">local</tspan> being your own machine. On an isolated</text>
    <text class="note" x="24" y="1118" data-step="15">host the worker runs with permissions bypassed. A worker</text>
    <text class="note" x="24" y="1134" data-step="15">writes no ticket file: <tspan class="m">dispatch review</tspan> imports its report.</text>
    <text class="host" x="536" y="1042" data-step="15">ticket/a on &lt;user@host&gt;</text>
    <text class="chiptext" x="582" y="1069" text-anchor="middle" data-step="15">build, test</text>
    <text class="chiptext" x="712" y="1069" text-anchor="middle" data-step="15"><tspan class="m">/mx:code-review</tspan></text>
    <text class="chiptext" x="852" y="1069" text-anchor="middle" data-step="15">its report, last</text>
  </g>
  <g>
    <text class="note" x="24" y="1166" data-step="20">A resume continues the worker's own conversation on the</text>
    <text class="note" x="24" y="1182" data-step="20">same branches. Writing done retires the run; on a redo, a</text>
    <text class="note" x="24" y="1198" data-step="20">reject or a lost session, <tspan class="m">dispatch ctl cleanup</tspan> removes</text>
    <text class="note" x="24" y="1214" data-step="20">its worktrees and branches.</text>
    <text class="host" x="536" y="1106" data-step="20">ticket/b on &lt;user@host&gt;</text>
    <text class="chiptext" x="582" y="1133" text-anchor="middle" data-step="20">build, test</text>
    <text class="chiptext" x="712" y="1133" text-anchor="middle" data-step="20">stopped, blocked</text>
    <text class="cmdline" x="796" y="1124" data-step="20">dispatch ctl resume &lt;slug&gt; &lt;model&gt;</text>
    <text class="note" x="796" y="1142" data-step="20">on guidance, or <tspan class="m">continue</tspan>, after an amend, a cleared blocker</text>
    <text class="note" x="796" y="1158" data-step="20">or a branch that moved; the status stays claimed</text>
    <text class="host" x="536" y="1170" data-step="22">ticket/c on local</text>
    <text class="chiptext" x="582" y="1197" text-anchor="middle" data-step="22">build, test</text>
    <text class="chiptext" x="712" y="1197" text-anchor="middle" data-step="22">gone</text>
    <text class="note" x="796" y="1190" data-step="22">the probe says gone: <tspan class="m">dispatch ctl cleanup &lt;slug&gt;</tspan>,</text>
    <text class="note" x="796" y="1206" data-step="22">and the ticket goes back to open for a fresh worker</text>
  </g>

  <!-- legend -->
  <line class="hair" x1="24" y1="1264" x2="1176" y2="1264"/>
  <circle class="dot" cx="28" cy="1296" r="3"/><path class="tick" d="M 28,1296 H 62" marker-end="url(#arrow)"/>
  <text class="legend" x="76" y="1300">typed in this row, writes the status it reaches</text>
  <path class="rail" d="M 492,1296 H 526" marker-end="url(#arrow-ink)"/>
  <text class="legend" x="540" y="1300">a move on</text>
  <path class="back" d="M 640,1296 H 674" marker-end="url(#arrow)"/>
  <text class="legend" x="688" y="1300">a move back</text>
  <rect class="card-you" x="820" y="1287" width="28" height="18" rx="3"/>
  <path class="you" d="M 856,1296 H 890" marker-end="url(#arrow-you)"/>
  <text class="legend" x="904" y="1300">your attention, asked here</text>
</svg>
<script>
  const root = document.documentElement
  const theme = new URLSearchParams(location.search).get("theme")
  const night = theme ? theme === "night" : matchMedia("(prefers-color-scheme: dark)").matches
  const set = (night) => {
    root.dataset.theme = night ? "night" : "day"
    document.getElementById("scheme").setAttribute("aria-label", night ? "switch to day" : "switch to night")
  }
  document.getElementById("scheme").addEventListener("click", () => set(root.dataset.theme !== "night"))
  set(night)
</script>
</body>
