[pytest]
# Test files and conftests are imported by their path, so pytest puts no test file's directory on
# sys.path. The directories below are where a check finds the scripts it imports by name.
addopts = --import-mode=importlib
pythonpath =
    mx/skills/dispatch
    mx/skills/domain-modelling
    mx/skills/github
    mx/skills/permissions-review/scripts
    mx/skills/session-page
    mx/skills/show
    mx/skills/tracker
markers =
    full_path: a Full-path check (GLOSSARY.md): make test-full-path runs it, make test and make test-all leave it out
